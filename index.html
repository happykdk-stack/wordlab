const DATA=[["Compensate","손해·불편을 보상하다","라틴어 compensare: 함께 무게를 달다","We will compensate you for the inconvenience.","불편에 대해 보상하겠습니다."],["Reimburse","이미 지출한 비용을 상환하다","프랑스어 bourse: 돈주머니","We will reimburse the customer for shipping.","고객에게 배송비를 상환하겠습니다."],["Quantify","수치화하다","라틴어 quantus: 얼마나 많은","Can you quantify the potential impact?","잠재적인 영향을 수치화할 수 있나요?"],["Bottleneck","병목 지점","bottle + neck: 병의 좁은 목","The approval step is a bottleneck.","승인 단계가 병목 지점입니다."],["Remediate","문제·결함을 시정하다","라틴어 remedium: 치료법","We need to remediate the defect.","결함을 시정해야 합니다."],["Allocate","자원을 배정하다","라틴어 locare: 배치하다","We need to allocate more resources.","자원을 더 배정해야 합니다."],["Redact","민감한 정보를 가리다","라틴어 redigere: 정리하다","Please redact personal information.","개인정보를 가려 주세요."],["Assess","평가하다","라틴어 assidere: 곁에 앉다","We need to assess the impact.","영향을 평가해야 합니다."],["Anticipate","예상하고 대비하다","라틴어 ante + capere: 앞서 잡다","We anticipate more inquiries.","문의가 늘어날 것으로 예상합니다."],["Corroborate","추가 증거로 뒷받침하다","라틴어 corroborare: 강하게 만들다","The inspection report corroborates the claim.","검사 보고서가 주장을 뒷받침합니다."],["Substantiate","증거로 입증하다","라틴어 substantia: 실체","We need evidence to substantiate the claim.","주장을 입증할 증거가 필요합니다."],["Defer","연기하다","라틴어 differre: 뒤로 옮기다","We may defer the system update.","시스템 업데이트를 연기할 수 있습니다."],["Liaise","연락하고 협의하다","프랑스어 liaison: 연결","I will liaise with the IT team.","IT팀과 연락하여 협의하겠습니다."],["Discrepancy","불일치","라틴어 discrepare: 서로 다르게 울리다","We found a discrepancy in the records.","기록에서 불일치를 발견했습니다."],["Reconcile","기록을 대조하여 일치시키다","라틴어 reconciliare: 다시 화합시키다","We need to reconcile the refund records.","환불 기록을 대조하여 일치시켜야 합니다."],["Mitigate","위험이나 영향을 완화하다","라틴어 mitis: 부드러운","We need to mitigate the risk.","위험을 완화해야 합니다."],["Expedite","처리를 신속하게 진행하다","라틴어 expedire: 장애물을 풀다","Could you expedite the refund?","환불을 신속히 진행해 주시겠습니까?"],["Workaround","임시 우회 해결책","work + around: 우회하여 처리하다","Is there a temporary workaround?","임시 우회 해결책이 있나요?"],["Backlog","밀린 미처리 업무","back + log: 뒤쪽의 큰 통나무","We need to clear the backlog.","밀린 업무를 처리해야 합니다."],["Prioritize","우선순위를 정하다","라틴어 prior: 앞선","We should prioritize safety cases.","안전 관련 케이스를 우선 처리해야 합니다."],["Clarify","명확히 설명하다","라틴어 clarus: 밝고 명확한","Could you clarify the policy?","정책을 명확히 설명해 주시겠습니까?"],["Handover","업무 인수인계","hand + over: 손에서 다른 사람에게 넘기다","Please complete the handover before your leave.","휴가 전에 업무 인계를 완료해 주세요."],["Accountability","결과에 대한 책임·설명 책임","accountable + -ity: 책임지는 상태","We need clear accountability for refund approvals.","환불 승인 책임 소재를 명확히 해야 합니다."],["Ownership","업무를 주도적으로 책임지는 태도","own + -ship: 자신의 것으로 맡는 상태","Who will take ownership of this issue?","누가 이 문제를 책임지고 처리할 예정인가요?"],["Deliverable","제출해야 하는 산출물","deliver + -able: 전달할 수 있는 것","The weekly CS report is our key deliverable.","주간 CS 보고서가 주요 산출물입니다."],["Milestone","프로젝트의 주요 단계","mile + stone: 거리 표시 돌","We reached the first milestone of the rollout.","도입 프로젝트의 첫 주요 단계를 달성했습니다."],["Dependency","선행 조건·의존 관계","라틴어 dependere: 매달리다","The launch has a dependency on IT approval.","출시는 IT 승인이라는 선행 조건에 달려 있습니다."],["Feasibility","실행 가능성","feasible + -ity: 실행 가능한 상태","We need to assess the feasibility of this change.","이 변경의 실행 가능성을 평가해야 합니다."],["Trade-off","상충 조건 간 절충","trade + off: 교환하며 일부를 내주다","There is a trade-off between speed and accuracy.","속도와 정확성 사이에는 절충이 필요합니다."],["Scope","업무·프로젝트 범위","그리스어 skopos: 목표·관찰 대상","Is this request within the project scope?","이 요청이 프로젝트 범위에 포함되나요?"],["Actionable","바로 실행할 수 있는","action + -able: 행동으로 옮길 수 있는","Please provide actionable feedback to the team.","팀에 실행 가능한 피드백을 제공해 주세요."],["Stakeholder","이해관계자","stake(이해관계·지분) + holder(보유자)","We should inform all key stakeholders.","주요 이해관계자 모두에게 알려야 합니다."],["Leverage","자원·강점을 활용하다","lever(지렛대)에서 유래한 leverage","We can leverage the existing CS data.","기존 CS 데이터를 활용할 수 있습니다."],["Rollout","새 서비스·기능의 단계적 출시","roll + out: 밖으로 펼치다","The rollout will begin next Monday.","새 기능 도입은 다음 주 월요일 시작됩니다."],["Constraint","제약 조건","라틴어 constringere: 함께 단단히 묶다","Budget constraints may delay the project.","예산 제약으로 프로젝트가 지연될 수 있습니다."],["Implication","영향·함의","라틴어 implicare: 안으로 접어 넣다·얽히게 하다","What are the implications for customer support?","고객 지원에 어떤 영향이 있나요?"],["Cadence","업무·회의의 정기적인 주기","라틴어 cadere: 떨어지다에서 발전한 리듬","Let's establish a weekly reporting cadence.","주간 보고 주기를 정합시다."],["Bandwidth","업무를 처리할 여력","band + width: 주파수 대역의 폭에서 확장","Our team has limited bandwidth this week.","이번 주에는 팀의 업무 여력이 부족합니다."],["Buy-in","제안에 대한 동의·지지","buy + in: 참여를 위해 지분을 사다에서 확장","We need leadership buy-in before proceeding.","진행하기 전에 리더십의 지지가 필요합니다."],["Touchpoint","고객·팀과의 접점","touch + point: 접촉하는 지점","We should improve every customer touchpoint.","모든 고객 접점을 개선해야 합니다."],["Follow-through","계획을 끝까지 실행하는 것","follow + through: 끝까지 따라가다","Strong follow-through is essential after the meeting.","회의 후 끝까지 실행하는 것이 중요합니다."],["Alignment","의견·방향의 일치","프랑스어 aligner: 한 줄로 맞추다","We need alignment on the refund policy.","환불 정책에 대한 의견 일치가 필요합니다."],["Benchmark","비교 평가 기준","bench(작업대) + mark(표시)에서 발전","Let's benchmark our CS response time.","CS 응답 시간을 비교 평가해 봅시다."],["Escalation","상위 담당자에게 문제 이관","escalate: 사다리로 올라가다에서 파생","This complaint requires escalation to the Quality team.","이 불만은 품질팀에 상위 이관해야 합니다."],["Initiative","주도적인 개선 활동","라틴어 initium: 시작","She is leading a customer experience initiative.","그녀는 고객 경험 개선 활동을 이끌고 있습니다."],["Momentum","추진력·진행 동력","라틴어 movere: 움직이다","We need to maintain momentum on this project.","이 프로젝트의 추진력을 유지해야 합니다."],["Onboarding","신규 직원·고객 적응 지원","on board: 배·조직에 탑승하다","We should improve the new agent onboarding process.","신규 상담원 온보딩 절차를 개선해야 합니다."],["Proactive","선제적인","pro-(앞으로) + active(행동하는)","Let's take a proactive approach to recurring issues.","반복 문제에 선제적으로 대응합시다."],["Retention","고객·직원 유지","라틴어 retinere: 붙잡아 두다","Customer retention is a key performance metric.","고객 유지는 핵심 성과 지표입니다."],["Transparency","투명성·정보 공개","라틴어 trans-(통과하여) + parere(드러나다)","We need more transparency about the project timeline.","프로젝트 일정에 대해 더 투명하게 공유해야 합니다."],["Alignment meeting","방향 조율 회의","alignment(일치) + meeting(회의)","Let's schedule an alignment meeting with Global IT.","글로벌 IT팀과 방향 조율 회의를 잡읍시다."],["Escalate","상위 담당자에게 보고하다","영어 escalator와 같은 라틴어 scala(사다리)에서 파생","Please escalate the unresolved complaint to the manager.","해결되지 않은 불만을 관리자에게 보고해 주세요."],["Streamline","절차를 간소화하다","stream(흐름)+line(선), 유선형이라는 뜻에서 확장","We should streamline the return approval process.","반품 승인 절차를 간소화해야 합니다."],["Rectify","잘못을 바로잡다","라틴어 rectus(곧은)+facere(만들다)에서 유래","We must rectify the billing error today.","오늘 청구 오류를 바로잡아야 합니다."],["Delegate","업무를 위임하다","라틴어 delegare(맡기다, 파견하다)에서 유래","I will delegate the follow-up tasks to the team.","후속 업무를 팀에 위임하겠습니다."],["Consolidate","통합하다","라틴어 consolidare(단단하게 만들다)에서 유래","Let's consolidate the weekly reports.","주간 보고서를 통합합시다."],["Facilitate","원활하게 하다","라틴어 facilis(쉬운)에서 유래","This checklist will facilitate onboarding.","이 점검표는 신규 직원 적응을 원활하게 할 것입니다."],["Verify","확인하고 검증하다","라틴어 verus(참된)+facere(만들다)에서 유래","Please verify the order number before issuing a refund.","환불 처리 전에 주문번호를 확인해 주세요."],["Implement","시행하다","라틴어 implementum(도구, 채우는 수단)에서 유래","We will implement the revised workflow next week.","다음 주에 개정된 업무 절차를 시행하겠습니다."],["Resolve","문제를 해결하다","라틴어 resolvere(풀어 주다)에서 유래","We need to resolve this case before Friday.","금요일 전까지 이 건을 해결해야 합니다."],["Coordinate","조율하다","라틴어 co-(함께)+ordinare(질서 있게 정리하다)에서 유래","I'll coordinate the delivery schedule with logistics.","물류팀과 배송 일정을 조율하겠습니다."],["Amend","수정하다","라틴어 emendare(잘못을 고치다)에서 유래","We need to amend the service guidelines.","서비스 지침을 수정해야 합니다."],["Authorize","승인하다·권한을 부여하다","라틴어 auctor(권위자·창시자)에서 유래","Only managers can authorize this refund.","관리자만 이 환불을 승인할 수 있습니다."],["Investigate","조사하다","라틴어 investigare(흔적을 따라가다)에서 유래","We will investigate the reported defect.","보고된 결함을 조사하겠습니다."],["Monitor","지속적으로 살피다","라틴어 monere(경고하다)에서 유래","Please monitor the return rate this week.","이번 주 반품률을 모니터링해 주세요."],["Diagnose","원인을 진단하다","그리스어 dia-(구별하여) + gnosis(앎)","The technician will diagnose the issue.","기술자가 문제의 원인을 진단할 것입니다."],["Document","문서로 기록하다","라틴어 documentum(증거·교훈)에서 유래","Document each step of the repair process.","수리 과정의 각 단계를 문서로 기록하세요."],["Forecast","예측하다","fore-(미리) + cast(던지다)에서 유래","We forecast stronger sales next quarter.","다음 분기 매출 증가를 예상합니다."],["Comply","규정을 준수하다","라틴어 complere(채우다·완수하다)에서 발전","All teams must comply with safety rules.","모든 팀은 안전 규정을 준수해야 합니다."],["Safeguard","보호하다","safe(안전한) + guard(지키다)","We must safeguard customer information.","고객 정보를 보호해야 합니다."],["Negotiate","협상하다","라틴어 negotiari(거래하다)에서 유래","We will negotiate a revised delivery date.","수정된 배송 일정을 협상하겠습니다."],["Contingency","비상 상황·예상치 못한 사태","라틴어 contingere(우연히 일어나다)에서 유래: con-(함께) + tangere(닿다)","We need a contingency plan in case the delivery is delayed.","배송이 지연될 경우에 대비한 비상 계획이 필요합니다."],["Consensus","합의·공감대","라틴어 consensus(의견의 일치), consentire(함께 느끼다)에서 유래: con-(함께) + sentire(느끼다)","Let's build consensus before changing the refund process.","환불 절차를 변경하기 전에 공감대를 형성합시다."],["Rationale","근거·판단 이유","라틴어 ratio(계산·이성)에서 나온 rationalis(이성적인)에 어원을 둠","Could you explain the rationale behind this policy?","이 정책을 도입한 판단 근거를 설명해 주시겠어요?"],["Audit","감사·점검하다","라틴어 audire(듣다)에서 유래. 회계 기록을 낭독하여 확인하던 관행과 관련","The team will audit the refund records next week.","팀에서 다음 주에 환불 기록을 점검할 예정입니다."],["Procurement","조달·구매 업무","라틴어 procurare(돌보다·관리하다)에서 유래: pro-(대신하여) + curare(돌보다)","Procurement will confirm the replacement part cost.","구매 담당 부서에서 교체 부품 비용을 확인할 예정입니다."],["Traceability","추적 가능성·이력 추적성","영어 trace(흔적을 따라가다, 고프랑스어 tracier) + -ability(가능성)","We need traceability for every returned unit.","반품된 모든 제품의 이력을 추적할 수 있어야 합니다."],["Validate","유효성을 검증하다","라틴어 validus(강한·유효한)에서 나온 validare(유효하게 하다)에서 유래","Please validate the order data before the upload.","업로드하기 전에 주문 데이터의 유효성을 검증해 주세요."],["Intervention","개입·중재","라틴어 intervenire(사이에 오다)에서 유래: inter-(사이에) + venire(오다)","This case may require intervention from the quality team.","이 건은 품질팀의 개입이 필요할 수 있습니다."],["Retrospective","사후 회고·되돌아보는","라틴어 retro-(뒤로) + spectare(바라보다)에서 유래","Let's hold a retrospective after the system rollout.","시스템 배포 후 회고 회의를 진행합시다."],["Attrition","인력 자연 감소·이탈","라틴어 attritio(마모), atterere(문질러 닳게 하다)에서 유래: ad-(~쪽으로) + terere(문지르다)","We are reviewing attrition trends in the support team.","지원팀의 인력 이탈 추세를 검토하고 있습니다."],["Triage","긴급도에 따라 분류·우선순위를 정하다","프랑스어 trier(분류하다)에서 유래한 triage(선별)","We should triage urgent customer cases first.","긴급한 고객 사례부터 우선 분류해야 합니다."],["Elicit","정보·반응을 이끌어 내다","라틴어 elicere(끌어내다): e-/ex-(밖으로) + lacere(유인하다)","Can you elicit more details from the customer?","고객에게서 추가 정보를 이끌어 낼 수 있나요?"],["Intermittent","간헐적인","라틴어 intermittere(중단하다): inter-(사이에) + mittere(보내다)","The device shows an intermittent power issue.","기기에서 간헐적인 전원 문제가 나타납니다."],["Deviation","기준·절차에서 벗어남, 편차","라틴어 deviare(길에서 벗어나다): de-(떨어져) + via(길)","Please document any deviation from the process.","절차에서 벗어난 사항을 모두 기록해 주세요."],["Recurrence","재발, 반복 발생","라틴어 recurrere(되돌아 달리다): re-(다시) + currere(달리다)","We are monitoring the recurrence of this defect.","이 결함의 재발 여부를 모니터링하고 있습니다."],["Attribution","원인·책임의 귀속, 출처 표시","라틴어 attribuere(배정하다): ad-(~에) + tribuere(할당하다)","We need to verify the attribution of the defect to shipping damage.","결함의 원인이 배송 중 손상이라는 판단을 확인해야 합니다."],["Deteriorate","악화되다, 품질이 저하되다","라틴어 deteriorare(악화시키다), deterior(더 나쁜)에서 유래","Customer satisfaction may deteriorate if delays continue.","지연이 계속되면 고객 만족도가 악화될 수 있습니다."],["Cohesive","유기적으로 결속된, 일관성 있는","라틴어 cohaerere(함께 붙어 있다): co-(함께) + haerere(달라붙다)","We need a cohesive response across all channels.","모든 채널에서 일관되고 유기적인 대응이 필요합니다."],["Impartial","공정한, 편파적이지 않은","im-(아닌) + partial(한쪽에 치우친; 라틴어 pars '부분'에서 유래)","The quality review must remain impartial.","품질 검토는 공정성을 유지해야 합니다."],["Synchronize","시간·상태를 동기화하다","그리스어 syn-(함께) + chronos(시간)에서 유래","Let's synchronize the order status across systems.","시스템 간 주문 상태를 동기화합시다."],["Articulate","명확하게 표현하다","라틴어 articulus(마디, 부분)에서 유래","Please articulate the main concern.","주요 우려 사항을 명확하게 말씀해 주세요."],["Synthesize","종합하다","그리스어 syn(함께)+tithenai(놓다)에서 유래","Let's synthesize the feedback into one report.","피드백을 하나의 보고서로 종합합시다."],["Reassess","재평가하다","re(다시)+assess(평가하다)","We need to reassess the current workflow.","현재 업무 절차를 재평가해야 합니다."],["Reiterate","다시 강조하다","라틴어 reiterare(반복하다)에서 유래","I'd like to reiterate our commitment to quality.","품질에 대한 우리의 약속을 다시 강조하고 싶습니다."],["Calibrate","조정하고 보정하다","라틴어 calibra(구경, 측정 기준)에서 유래","We should calibrate the targets using recent data.","최근 데이터를 바탕으로 목표치를 조정해야 합니다."],["Outline","개요를 설명하다","out(바깥)+line(선)에서 유래","Could you outline the proposed solution?","제안한 해결책의 개요를 설명해 주시겠어요?"],["Advocate","지지하다, 옹호하다","라틴어 advocare(도움을 청하다)에서 유래","I advocate a simpler customer journey.","저는 더 간단한 고객 경험을 지지합니다."],["Convene","회의를 소집하다","라틴어 con(함께)+venire(오다)에서 유래","We will convene a meeting with the service team.","서비스팀과 회의를 소집하겠습니다."],["Decompose","구성 요소로 나누다","de(분리)+compose(구성하다)","Let's decompose the issue into smaller tasks.","문제를 더 작은 작업으로 나눕시다."],["Intervene","개입하다","라틴어 inter(사이)+venire(오다)에서 유래","The manager may need to intervene.","매니저가 개입해야 할 수도 있습니다."],["Escalatory","상위 단계로 확대되는","escalate(단계적으로 올리다)에서 파생","The issue requires an escalatory response.","이 문제에는 상위 단계의 대응이 필요합니다."],["Prerequisite","선행 조건, 필수 요건","pre(이전)+requisite(필요한 것)","Approval is a prerequisite for the refund.","환불을 위해서는 승인이 선행 조건입니다."],["Viability","실행 가능성, 생존 가능성","viable(살아갈 수 있는)+ity","We should evaluate the viability of this proposal.","이 제안의 실행 가능성을 평가해야 합니다."],["Accountable","책임을 지는","account(설명하다)+able(가능한)","The team leader is accountable for the outcome.","팀장은 결과에 대한 책임을 집니다."],["Rectification","시정, 바로잡음","라틴어 rectus(곧은)+facere(만들다)","Rectification of the error is our priority.","오류 시정이 최우선입니다."],["Facilitator","진행자, 촉진자","라틴어 facilis(쉬운)+ator(행위자)","A facilitator will guide the workshop.","진행자가 워크숍을 이끌 것입니다."],["Deprioritize","우선순위를 낮추다","de(낮추다)+prioritize(우선시하다)","We may deprioritize nonurgent requests.","긴급하지 않은 요청의 우선순위를 낮출 수 있습니다."],["Benchmarking","비교 평가, 벤치마킹","benchmark(기준점)+ing","Benchmarking will reveal service gaps.","비교 평가를 통해 서비스 격차를 찾을 것입니다."],["Reallocate","재배분하다","re(다시)+allocate(배정하다)","Let's reallocate staff during peak hours.","혼잡 시간대에 직원을 재배분합시다."],["Streamlining","절차 간소화","streamline(유선형으로 만들다)+ing","Streamlining the process will reduce delays.","절차를 간소화하면 지연을 줄일 수 있습니다."],["Resilience","회복력, 복원력","라틴어 resilire(다시 튀어 오르다)","We need resilience during unexpected changes.","예상치 못한 변화에도 회복력이 필요합니다."],["Oversight","감독, 관리상의 실수","over(위에서)+sight(봄)","The oversight led to a shipment delay.","그 관리상의 실수로 배송이 지연됐습니다."],["Compliance","규정 준수","comply(따르다)+ance","Compliance with policy is essential.","정책을 준수하는 것은 필수입니다."],["Mitigation","완화 조치","라틴어 mitigare(부드럽게 하다)+tion","Our mitigation measures reduced the risk.","완화 조치로 위험을 줄였습니다."],["Disseminate","널리 전달하다","라틴어 disseminare(씨앗을 뿌리다)","Please disseminate the updated guidelines.","변경된 지침을 널리 공유해 주세요."],["Interdependency","상호 의존성","inter(상호)+dependency(의존)","The projects have strong interdependencies.","프로젝트 사이의 상호 의존성이 큽니다."],["Subsequent","이후의, 뒤따르는","라틴어 subsequi(뒤따르다)","Subsequent reviews found no further defects.","후속 검토에서는 추가 결함이 발견되지 않았습니다."],["Turnaround","처리 소요 시간, 전환","turn(돌다)+around(주위)","We must improve the repair turnaround time.","수리 처리 시간을 개선해야 합니다."],["Replenish","보충하다","re(다시)+plenish(채우다)","Please replenish the spare parts inventory.","예비 부품 재고를 보충해 주세요."],["Conformance","규격 적합성","conform(일치하다)+ance","We will verify conformance with the standard.","기준에 적합한지 확인하겠습니다."],["Delegation","업무 위임","라틴어 delegare(맡기다)","Clear delegation can speed up decisions.","명확한 업무 위임은 의사결정을 빠르게 합니다."],["Concise","간결한","라틴어 concidere(잘라 줄이다)","Keep your update concise and specific.","업데이트 내용을 간결하고 구체적으로 작성하세요."],["Elaborate","자세히 설명하다","라틴어 elaborare(정성 들여 만들다)","Could you elaborate on the root cause?","근본 원인을 더 자세히 설명해 주시겠어요?"],["Cumulative","누적되는","라틴어 cumulare(쌓다)","The cumulative costs exceeded our estimate.","누적 비용이 예상치를 초과했습니다."],["Provisional","잠정적인, 임시의","라틴어 providere(미리 보다)에서 파생","We have a provisional delivery date.","잠정적인 배송 일정이 정해졌습니다."],["Correlate","상관관계가 있다","cor(함께)+relate(관련짓다)","Customer complaints correlate with delivery delays.","고객 불만은 배송 지연과 상관관계가 있습니다."],["Reinforce","강화하다","re(다시)+inforce(힘을 더하다)","We should reinforce the safety procedure.","안전 절차를 강화해야 합니다."],["Constraint-based","제약 조건에 기반한","constraint(제약)+based(기반)","We need a constraint-based schedule.","제약 조건을 반영한 일정이 필요합니다."],["Operationalize","실제 운영에 적용하다","operation(운영)+alize(만들다)","We must operationalize the new process.","새로운 절차를 실제 운영에 적용해야 합니다."],["Capacity","처리 능력, 수용량","라틴어 capere(담다)","Our team has limited capacity today.","오늘 우리 팀의 처리 능력이 제한적입니다."],["Escalation path","상위 보고 절차","escalation(상위 단계 확대)+path(경로)","Clarify the escalation path for urgent cases.","긴급 건의 상위 보고 절차를 명확히 하세요."],["Deliverability","전달 가능성","deliver(전달하다)+ability","We need to assess the deliverability of emails.","이메일의 전달 가능성을 평가해야 합니다."],["Threshold","기준치, 한계점","고대 영어 þrescold(문턱)","The response time crossed our threshold.","응답 시간이 기준치를 넘었습니다."],["Resolution","해결, 결의","라틴어 resolvere(풀다)","We are working toward a timely resolution.","적시에 문제를 해결하기 위해 노력하고 있습니다."],["Revise","수정하다","re(다시)+vis(보다)","Please revise the draft based on feedback.","피드백을 반영해 초안을 수정해 주세요."],["Solicit","의견 등을 요청하다","라틴어 sollicitare(자극하다, 요청하다)","We will solicit feedback from customers.","고객에게 피드백을 요청하겠습니다."],["Feasible","실현 가능한","프랑스어 faisable(할 수 있는)","A phased rollout is more feasible.","단계적 도입이 더 실현 가능합니다."],["Consistent","일관된","라틴어 consistere(함께 서다)","We need consistent answers across channels.","모든 채널에서 일관된 답변이 필요합니다."],["Proportionate","비례하는, 적절한 수준의","proportion(비율)+ate","Our response should be proportionate to the risk.","대응 수준은 위험에 비례해야 합니다."],["Scrutinize","면밀히 조사하다","라틴어 scrutari(샅샅이 찾다)","We should scrutinize the test results.","시험 결과를 면밀히 검토해야 합니다."]];
const KEY='wordlab_progress_v2';

let firebaseAuth=null,firebaseDb=null,firebaseApi=null,currentUser=null,cloudReady=false,authEpoch=0;
const authBtn=document.getElementById('authBtn'),syncStatus=document.getElementById('syncStatus');
function syncMessage(s,isError=false){syncStatus.textContent=s;syncStatus.classList.toggle('err',isError)}
function authClick(){
if(!firebaseAuth||!firebaseApi)return;
if(currentUser){firebaseApi.signOut(firebaseAuth).catch(e=>syncMessage('로그아웃 오류: '+e.code,true));return}
firebaseApi.signInWithPopup(firebaseAuth,new firebaseApi.GoogleAuthProvider()).catch(e=>syncMessage('로그인 오류: '+(e.code||e.message),true));
}
function errorLabel(e){
const code=String(e.code||e.message||'unknown').replace('firestore/','');
if(code.includes('permission-denied'))return '권한 거부: Firestore 규칙 확인 필요';
if(code.includes('not-found'))return '데이터베이스 ID 확인 필요';
if(code.includes('unavailable'))return '서버 연결 실패: 네트워크 확인 필요';
return '클라우드 오류: '+code;
}
const pendingKey='wordlab_pending_v1';
let metrics={attempts:0,correct:0,cardChecks:0};
let rankOptIn=false,rankNickname='',rankRows=[],rankMessage='',rankRefreshTimer=null;
function metricsKey(){return 'wordlab_metrics_'+(currentUser?currentUser.uid:'guest')}
function readMetrics(){try{return JSON.parse(localStorage.getItem(metricsKey())||'{}')}catch(e){return {}}}
function loadMetrics(){metrics={attempts:0,correct:0,cardChecks:0,...readMetrics()}}
function saveMetrics(){try{localStorage.setItem(metricsKey(),JSON.stringify(metrics))}catch(e){}}
function metricsUpdate(ok,isQuiz){
if(isQuiz){metrics.attempts++;if(ok)metrics.correct++}else metrics.cardChecks++;
saveMetrics();
if(currentUser&&cloudReady)saveCloudMetrics();
}
async function saveCloudMetrics(){
if(!currentUser||!cloudReady)return;
try{await firebaseApi.setDoc(firebaseApi.doc(firebaseDb,'users',currentUser.uid,'wordlab','progress'),{metrics},{merge:true});}catch(e){syncMessage(errorLabel(e),true)}
}
function levelName(n){return n>=45?'마스터':n>=30?'전문가':n>=15?'숙련자':n>=5?'도전자':'새싹'}
function statNumbers(){const values=Object.values(progress);return {known:values.filter(x=>x==='known').length,missed:values.filter(x=>x==='missed').length,attempts:metrics.attempts,correct:metrics.correct}}
function scoreValue(){return statNumbers().known}
function maskedEmail(email){const p=String(email||'').split('@');if(p.length!==2)return '학습자';return p[0].slice(0,p[0].length>3?2:1)+'***@'+p[1]}
function safeRankLabel(entry){const label=String(entry.nickname||'');const at=label.indexOf('@');return at>0&&label.includes('***')&&label.slice(at+1).includes('.')?' '+label.trim():'기존 사용자 (재로그인 필요)'}

function vocabHistoryHTML(){
 return '<section class="vocab-history" data-wordlab-history="adult"><h3>📅 단어 업데이트 이력</h3><p class="small">최근 단어 업데이트: <b data-history-latest>확인 중…</b> · 현재 <b>'+DATA.length+'개</b></p><div data-history-list class="vocab-history-list">업데이트 기록을 확인하고 있습니다.</div></section>';
}

async function refreshWordlabHistory(){
 const section=document.querySelector('[data-wordlab-history="adult"]');
 if(!section)return;
 const status=section.querySelector('[data-history-latest]');
 const list=section.querySelector('[data-history-list]');
 try{
  const url='data/word-update-history.json?v='+Date.now();
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const payload=await response.json();
  if(!payload||!Array.isArray(payload.history))throw new Error('Invalid history');
  if(!section.isConnected)return;
  const entries=[...payload.history].sort((a,b)=>b.date.localeCompare(a.date));
  const latest=entries[0];
  if(!latest){status.textContent='추가 이력 없음';list.textContent='등록된 업데이트 이력이 없습니다.';return}
  status.textContent=latest.date.replace(/-/g,'.');
  list.innerHTML=entries.slice(0,12).map(entry=>{
   const amount=(Array.isArray(entry.adult)?entry.adult.length:0);
   const note=entry.type==='manual'?'추가 요청':'자동 추가';
   return '<div class="vocab-history-item"><b>'+esc(entry.date.replace(/-/g,'.'))+'</b><span>'+note+' · '+amount+'개'+''+'</span></div>';
  }).join('');
 }catch(err){
  if(!section.isConnected)return;
  status.textContent='확인 불가';
  list.textContent='단어는 앱에 등록되어 있지만 날짜 기록을 불러오지 못했습니다. 페이지를 다시 열어 주세요.';
  console.warn('WordLab history:',err);
 }
}

const n=statNumbers(),pct=n.attempts?Math.round(n.correct/n.attempts*100):0;
app.innerHTML='<h2>📊 나의 학습 통계</h2>'+vocabHistoryHTML()+'<p class="small">내 계정의 학습 현황입니다.</p><div class="stats-grid">'+
[['암기한 단어',n.known+'개'],['틀린 단어',n.missed+'개'],['퀴즈 정답률',pct+'%'],['누적 퀴즈 풀이',n.attempts+'문제']].map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+
'</div><div class="rank-level"><b>🌟 '+levelName(n.known)+'</b><p class="small">암기한 단어 '+n.known+'개 · 개인 점수 '+scoreValue()+'점</p></div><p class="small">통계는 이 기능이 추가된 이후의 퀴즈 기록부터 누적됩니다. 이전의 정답·오답 상태는 암기 단어 수에 반영됩니다.</p>';
refreshWordlabHistory();
}

app.innerHTML='<h2>🏆 친구 순위표</h2><p class="small">이메일 일부를 가려 표시합니다. 기존 닉네임은 더 이상 노출하지 않습니다. 참여 후 학습 완료 수는 자동 갱신됩니다.</p>'+
'<div class="rank-level">학습 완료 <b>'+n.known+' / '+DATA.length+'개</b> · 복습 필요 '+n.missed+'개</div>'+

function kstDate(offset=0){
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 const d=new Date(parts+'T12:00:00Z');
 d.setUTCDate(d.getUTCDate()+offset);
 return d.toISOString().slice(0,10);
}
function initializeSrs(){
 let changed=false;
 for(const word of DATA){
  const key=word[0].toLowerCase();
  if(!srs[key]&&(progress[key]==='known'||progress[key]==='missed')){
   srs[key]={level:0,due:kstDate(),reviews:0};changed=true;
  }
 }
 if(changed)saveSrs();
}
function saveSrs(){
 try{localStorage.setItem(SRS_KEY,JSON.stringify(srs))}catch(e){}

}
function dueWordList(){
 const today=kstDate();
 return DATA.filter(word=>{

 });
}

function scheduleSrs(word,correct){
 const key=word.toLowerCase();
 const prev=srs[key]||{level:0,reviews:0};
 const level=correct?Math.min((prev.level||0)+1,6):0;
 const intervals=[1,1,3,7,14,30,60];
 srs[key]={level,reviews:(prev.reviews||0)+1,due:kstDate(intervals[level]),last:kstDate()};
 saveSrs();
}

const ETYMOLOGY_MEMORY={"Compensate":"무게를 함께 달아 균형을 맞추는 장면을 떠올리세요. 손해가 난 만큼 보상해 균형을 되찾는다는 의미입니다.","Reimburse":"bourse는 돈주머니입니다. 이미 지갑에서 낸 돈을 다시 채워 준다고 기억하세요.","Quantify":"quantus는 '얼마나 많은가?'라는 질문입니다. 막연한 문제를 숫자로 바꾸는 일입니다.","Bottleneck":"넓은 병몸통에 비해 목은 좁습니다. 많은 일이 한 지점에 몰리면 처리 흐름이 막힙니다.","Remediate":"remedium은 치료법입니다. 고장이나 문제를 환자처럼 진단하고 바로잡는다고 기억하세요.","Allocate":"locare는 자리에 놓는다는 뜻입니다. 사람·시간·예산을 각각 알맞은 자리에 배정합니다.","Redact":"원래 문서를 다듬고 편집한다는 의미에서, 공개할 수 없는 정보를 가려 내는 뜻으로 발전했습니다.","Assess":"assidere는 곁에 앉아 판단하는 장면입니다. 대상 옆에서 상태를 살펴 평가합니다.","Anticipate":"ante는 '앞서', capere는 '잡다'입니다. 일이 생기기 전에 먼저 잡아 준비한다고 기억하세요.","Corroborate":"라틴어 robur는 힘·튼튼한 나무를 뜻합니다. 추가 증거가 주장을 더 튼튼하게 만듭니다.","Substantiate":"substantia는 실체·본질입니다. 주장에 실제 자료와 증거를 붙여 실체를 보여 줍니다.","Defer":"뒤쪽으로 옮긴다는 뜻입니다. 오늘 할 일을 미래 일정으로 밀어 놓는 장면을 떠올리세요.","Liaise":"liaison은 연결입니다. 서로 다른 팀 사이를 이어 주면서 소통과 협의를 돕는 일입니다.","Discrepancy":"두 소리가 서로 다르게 울리는 데서 유래했습니다. 기록 두 개의 숫자가 서로 다른 상황을 떠올리세요.","Reconcile":"re-는 다시, conciliare는 화합시키다입니다. 다른 기록을 대조해 다시 일치시킵니다.","Mitigate":"mitis는 부드러운이라는 뜻입니다. 심각한 위험의 강도를 부드럽게 낮춘다고 기억하세요.","Expedite":"발에 걸린 장애물을 풀어 앞으로 빨리 나아간다는 뜻에서 왔습니다. 일을 막는 장애물을 제거합니다.","Workaround":"work(일하다)와 around(돌아서)가 합쳐졌습니다. 정면 해결이 어려울 때 우회로를 찾습니다.","Backlog":"뒤에 쌓인 기록처럼 처리하지 못한 업무가 계속 밀려 있는 모습입니다.","Prioritize":"prior는 '앞선'이라는 뜻입니다. 중요한 일을 목록의 맨 앞으로 옮깁니다.","Clarify":"clarus는 밝은·맑은입니다. 흐릿했던 설명을 밝게 비춰 이해하기 쉽게 만드는 것입니다.","Handover":"hand(손)와 over(건네다)를 결합했습니다. 담당 업무와 책임을 다른 사람에게 넘기는 것입니다.","Accountability":"account는 보고하고 설명한다는 뜻과 연결됩니다. 결과가 왜 나왔는지 설명할 책임입니다.","Ownership":"own(자기 것으로 여기다)에서 나왔습니다. 맡은 일을 남의 일이 아닌 내 일로 책임집니다.","Deliverable":"deliver(전달하다)에 -able을 붙였습니다. 실제로 제출·전달해야 하는 결과물입니다.","Milestone":"먼 길에서 거리를 알려 주던 돌 표지판입니다. 프로젝트의 진행 정도를 알려 주는 주요 지점입니다.","Dependency":"dependere는 매달리다입니다. 한 일이 다른 일이 끝나야 가능한 관계를 떠올리세요.","Feasibility":"feasible은 해낼 수 있는이라는 뜻입니다. 아이디어가 실제로 가능한지 따지는 과정입니다.","Trade-off":"하나를 얻으려면 다른 것을 일부 내놓아야 합니다. 속도와 품질처럼 서로 상충하는 선택을 기억하세요.","Scope":"skopos는 목표나 관찰 대상을 뜻합니다. 프로젝트의 경계를 정해 무엇을 포함할지 결정합니다.","Actionable":"action(행동)에 -able을 붙였습니다. 말이나 아이디어를 당장 실행할 수 있는 상태입니다.","Stakeholder":"stake는 걸려 있는 이해관계, holder는 가진 사람입니다. 결정의 결과에 이해가 걸린 사람입니다.","Leverage":"lever는 지렛대입니다. 적은 힘으로 큰 물건을 움직이듯 가진 자원을 효과적으로 활용합니다.","Rollout":"말려 있던 것을 바깥으로 펼치는 모습입니다. 새 기능을 사용자에게 차례로 공개합니다.","Constraint":"con-은 함께, stringere는 꽉 묶다입니다. 선택이나 행동을 제한하는 조건입니다.","Implication":"implicare는 안으로 접거나 얽어 넣는다는 뜻입니다. 말 속에 직접 드러나지 않은 영향이 숨어 있습니다.","Cadence":"규칙적으로 떨어지는 발걸음이나 박자입니다. 회의와 업무가 반복되는 리듬을 떠올리세요.","Bandwidth":"원래 통신에서 쓸 수 있는 주파수 폭입니다. 업무에서는 지금 감당할 수 있는 시간과 여력을 뜻합니다.","Buy-in":"제안에 지분을 사서 참여하는 느낌입니다. 구성원이 아이디어를 받아들이고 지지하는 것입니다.","Touchpoint":"touch(접촉하다)+point(지점)입니다. 고객이 브랜드나 팀을 만나는 모든 접점입니다.","Follow-through":"시작에 그치지 않고 끝까지 따라간다는 뜻입니다. 계획을 실행하고 마무리까지 책임집니다.","Alignment":"한 줄로 맞춘다는 데서 출발했습니다. 구성원 모두 같은 목표를 향하도록 방향을 맞춥니다.","Benchmark":"측정 기준이 되는 표식에서 유래했습니다. 성과를 비교할 때 쓰는 기준점입니다.","Escalation":"사다리를 한 단씩 올라가는 모습입니다. 해결이 어려운 문제를 상위 단계로 올립니다.","Momentum":"movere는 움직이다입니다. 한번 시작한 변화가 계속 앞으로 나아가게 하는 힘입니다.","Onboarding":"배나 조직에 올라타는 모습입니다. 새 직원·고객이 팀이나 제품에 익숙해지는 과정입니다.","Proactive":"pro-는 앞서라는 뜻입니다. 문제가 생긴 뒤가 아니라 미리 움직여 대비합니다.","Retention":"retinere는 붙잡아 두다입니다. 고객이나 직원이 떠나지 않고 계속 함께하도록 유지합니다.","Transparency":"trans-는 통과해서, parere는 나타나다입니다. 안쪽이 보일 만큼 정보를 투명하게 공개합니다.","Escalate":"scala는 사다리입니다. 문제를 해결할 수 있는 더 높은 담당 단계로 올립니다.","Streamline":"물의 흐름을 방해하지 않는 유선형에서 왔습니다. 불필요한 단계를 줄여 업무 흐름을 매끄럽게 합니다.","Rectify":"rectus는 곧은, facere는 만들다입니다. 잘못된 것을 다시 곧게 바로잡습니다.","Delegate":"delegare는 다른 사람에게 맡기다는 뜻입니다. 특정 권한과 업무를 다른 담당자에게 넘깁니다.","Consolidate":"con-은 함께, solidus는 단단한입니다. 여러 요소를 하나로 모아 더 견고하게 만듭니다.","Facilitate":"facilis는 쉽다는 뜻입니다. 복잡한 일을 더 쉽게 진행되도록 돕습니다.","Verify":"verus는 진짜, facere는 만들다입니다. 어떤 내용이 사실인지 확인합니다.","Resolve":"re-는 다시, solvere는 풀다입니다. 엉킨 문제의 매듭을 풀어 해결합니다.","Coordinate":"co-는 함께, ordinare는 질서를 세우다입니다. 여러 사람이 같은 순서로 움직이게 조율합니다.","Investigate":"vestigium은 발자국을 뜻합니다. 흔적을 따라가며 원인과 사실을 밝혀냅니다.","Diagnose":"dia-는 구별해, gnosis는 앎입니다. 증상과 원인을 구분해 알아내는 과정입니다.","Forecast":"fore-는 미리라는 뜻입니다. 아직 오지 않은 상황을 앞서 그려 보는 예측입니다.","Safeguard":"safe(안전한)와 guard(지키다)입니다. 위험으로부터 사람이나 정보를 보호합니다.","Consensus":"con-은 함께, sentire는 느끼다입니다. 여러 사람이 같은 생각에 도달하는 합의입니다.","Contingency":"우연히 일어날 수 있는 사건을 뜻합니다. 발생 여부가 불확실한 상황에 대비하는 계획입니다.","Traceability":"trace는 흔적을 따라가다는 뜻입니다. 제품이나 사건이 어디서 시작됐는지 이력을 추적합니다.","Validate":"validus는 강하고 유효한이라는 뜻입니다. 값이나 절차가 믿을 만한지 확인합니다.","Retrospective":"retro-는 뒤로, spectare는 보다입니다. 일이 끝난 뒤 되돌아보며 배웁니다.","Triage":"프랑스어 trier는 분류하다입니다. 문제를 모두 동일하게 다루지 않고 긴급도대로 나눕니다.","Elicit":"e-/ex-는 밖으로, lacere는 끌어내다입니다. 질문을 통해 상대의 생각이나 정보를 끌어냅니다.","Intermittent":"inter-는 사이, mittere는 보내다입니다. 계속되는 대신 중간중간 끊기며 발생합니다.","Deviation":"de-는 벗어남, via는 길입니다. 정해진 기준이나 경로에서 벗어나는 현상입니다.","Recurrence":"re-는 다시, currere는 달리다입니다. 문제가 되돌아와 다시 발생하는 상황입니다.","Cohesive":"co-는 함께, haerere는 달라붙다입니다. 여러 부분이 하나로 잘 붙어 움직입니다.","Impartial":"im-은 아닌, partial은 한쪽 편을 드는입니다. 어느 한쪽에도 치우치지 않는 태도입니다.","Synchronize":"syn-은 함께, chronos는 시간입니다. 서로 다른 시스템의 시간과 상태를 맞춥니다.","Synthesize":"syn-은 함께, tithenai는 놓다입니다. 여러 정보를 모아 하나의 결론을 만듭니다.","Reassess":"re-는 다시라는 뜻입니다. 이미 평가한 내용을 새로운 정보로 다시 판단합니다.","Reiterate":"re-가 반복의 뜻을 더합니다. 중요한 내용을 다시 한 번 분명하게 말합니다.","Convene":"con-은 함께, venire는 오다입니다. 사람들이 한자리에 모이도록 회의를 소집합니다.","Intervene":"inter-는 사이, venire는 오다입니다. 일이 진행되는 사이에 들어가 상황을 바꿉니다.","Prerequisite":"pre-는 먼저, requisite는 필요한 것입니다. 어떤 일을 시작하기 전에 반드시 갖출 조건입니다.","Accountable":"account는 설명하고 보고한다는 뜻입니다. 결과에 대해 답하고 책임져야 하는 상태입니다.","Reallocate":"re-는 다시, allocate는 배정하다입니다. 기존 자원을 새로운 필요에 맞게 다시 나눕니다.","Resilience":"resilire는 뒤로 튀어 오르다입니다. 충격을 받은 뒤 다시 원래 상태로 돌아가는 힘입니다.","Compliance":"comply는 규정이나 요청을 따르다입니다. 정해진 기준을 실제로 지키는 상태입니다.","Mitigation":"mitigare는 부드럽게 하다는 뜻입니다. 위험이나 피해가 심해지지 않게 완화하는 조치입니다.","Replenish":"re-는 다시, plenus는 가득 찬입니다. 줄어든 재고를 다시 채웁니다.","Delegation":"delegare는 다른 사람에게 맡기다입니다. 권한이나 업무를 다른 담당자에게 정식으로 넘깁니다.","Concise":"라틴어 concidere는 잘라 줄이다입니다. 불필요한 말을 덜어내 핵심만 남깁니다.","Elaborate":"elaborare는 공들여 작업하다는 뜻입니다. 짧게 말한 내용을 더 자세히 설명합니다.","Cumulative":"cumulare는 쌓아 올리다입니다. 비용과 실적이 하나씩 더해져 누적됩니다.","Correlate":"co-는 함께, relate는 관련짓다입니다. 두 수치가 함께 변하는 관계를 나타냅니다.","Reinforce":"re-는 다시, force는 힘입니다. 부족한 부분에 힘을 더해 강화합니다.","Capacity":"capere는 담다입니다. 한 번에 담거나 처리할 수 있는 최대 양을 기억하세요."};
