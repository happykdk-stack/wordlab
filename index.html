oice.correct{background:#e3f6eb;border-color:#56b88a}.choice.wrong{background:#ffe9ea;border-color:#dc8990}.feedback{padding:13px;border-radius:12px;background:#f1f5ff;font-size:14px;line-height:1.7;margin-top:15px}.center{text-align:center}.small{font-size:13px;color:#73809a}footer{margin-top:20px;text-align:center;font-size:12px;color:#8792a6}@media(max-width:480px){.panel{padding:16px}.tabs button{font-size:12px}.card{min-height:270px}}

const DATA=[["Compensate","손해·불편을 보상하다","라틴어 compensare: 함께 무게를 달다","We will compensate you for the inconvenience.","불편에 대해 보상하겠습니다."],["Reimburse","이미 지출한 비용을 상환하다","프랑스어 bourse: 돈주머니","We will reimburse the customer for shipping.","고객에게 배송비를 상환하겠습니다."],["Quantify","수치화하다","라틴어 quantus: 얼마나 많은","Can you quantify the potential impact?","잠재적인 영향을 수치화할 수 있나요?"],["Bottleneck","병목 지점","bottle + neck: 병의 좁은 목","The approval step is a bottleneck.","승인 단계가 병목 지점입니다."],["Remediate","문제·결함을 시정하다","라틴어 remedium: 치료법","We need to remediate the defect.","결함을 시정해야 합니다."],["Allocate","자원을 배정하다","라틴어 locare: 배치하다","We need to allocate more resources.","자원을 더 배정해야 합니다."],["Redact","민감한 정보를 가리다","라틴어 redigere: 정리하다","Please redact personal information.","개인정보를 가려 주세요."],["Assess","평가하다","라틴어 assidere: 곁에 앉다","We need to assess the impact.","영향을 평가해야 합니다."],["Anticipate","예상하고 대비하다","라틴어 ante + capere: 앞서 잡다","We anticipate more inquiries.","문의가 늘어날 것으로 예상합니다."],["Corroborate","추가 증거로 뒷받침하다","라틴어 corroborare: 강하게 만들다","The inspection report corroborates the claim.","검사 보고서가 주장을 뒷받침합니다."],["Substantiate","증거로 입증하다","라틴어 substantia: 실체","We need evidence to substantiate the claim.","주장을 입증할 증거가 필요합니다."],["Defer","연기하다","라틴어 differre: 뒤로 옮기다","We may defer the system update.","시스템 업데이트를 연기할 수 있습니다."],["Liaise","연락하고 협의하다","프랑스어 liaison: 연결","I will liaise with the IT team.","IT팀과 연락하여 협의하겠습니다."],["Discrepancy","불일치","라틴어 discrepare: 서로 다르게 울리다","We found a discrepancy in the records.","기록에서 불일치를 발견했습니다."],["Reconcile","기록을 대조하여 일치시키다","라틴어 reconciliare: 다시 화합시키다","We need to reconcile the refund records.","환불 기록을 대조하여 일치시켜야 합니다."],["Mitigate","위험이나 영향을 완화하다","라틴어 mitis: 부드러운","We need to mitigate the risk.","위험을 완화해야 합니다."],["Expedite","처리를 신속하게 진행하다","라틴어 expedire: 장애물을 풀다","Could you expedite the refund?","환불을 신속히 진행해 주시겠습니까?"],["Workaround","임시 우회 해결책","work + around: 우회하여 처리하다","Is there a temporary workaround?","임시 우회 해결책이 있나요?"],["Backlog","밀린 미처리 업무","back + log: 뒤쪽의 큰 통나무","We need to clear the backlog.","밀린 업무를 처리해야 합니다."],["Prioritize","우선순위를 정하다","라틴어 prior: 앞선","We should prioritize safety cases.","안전 관련 케이스를 우선 처리해야 합니다."],["Clarify","명확히 설명하다","라틴어 clarus: 밝고 명확한","Could you clarify the policy?","정책을 명확히 설명해 주시겠습니까?"],["Handover","업무 인수인계","hand + over: 손에서 다른 사람에게 넘기다","Please complete the handover before your leave.","휴가 전에 업무 인계를 완료해 주세요."],["Accountability","결과에 대한 책임·설명 책임","accountable + -ity: 책임지는 상태","We need clear accountability for refund approvals.","환불 승인 책임 소재를 명확히 해야 합니다."],["Ownership","업무를 주도적으로 책임지는 태도","own + -ship: 자신의 것으로 맡는 상태","Who will take ownership of this issue?","누가 이 문제를 책임지고 처리할 예정인가요?"],["Deliverable","제출해야 하는 산출물","deliver + -able: 전달할 수 있는 것","The weekly CS report is our key deliverable.","주간 CS 보고서가 주요 산출물입니다."],["Milestone","프로젝트의 주요 단계","mile + stone: 거리 표시 돌","We reached the first milestone of the rollout.","도입 프로젝트의 첫 주요 단계를 달성했습니다."],["Dependency","선행 조건·의존 관계","라틴어 dependere: 매달리다","The launch has a dependency on IT approval.","출시는 IT 승인이라는 선행 조건에 달려 있습니다."],["Feasibility","실행 가능성","feasible + -ity: 실행 가능한 상태","We need to assess the feasibility of this change.","이 변경의 실행 가능성을 평가해야 합니다."],["Trade-off","상충 조건 간 절충","trade + off: 교환하며 일부를 내주다","There is a trade-off between speed and accuracy.","속도와 정확성 사이에는 절충이 필요합니다."],["Scope","업무·프로젝트 범위","그리스어 skopos: 목표·관찰 대상","Is this request within the project scope?","이 요청이 프로젝트 범위에 포함되나요?"],["Actionable","바로 실행할 수 있는","action + -able: 행동으로 옮길 수 있는","Please provide actionable feedback to the team.","팀에 실행 가능한 피드백을 제공해 주세요."],["Stakeholder","이해관계자","stake(이해관계·지분) + holder(보유자)","We should inform all key stakeholders.","주요 이해관계자 모두에게 알려야 합니다."],["Leverage","자원·강점을 활용하다","lever(지렛대)에서 유래한 leverage","We can leverage the existing CS data.","기존 CS 데이터를 활용할 수 있습니다."],["Rollout","새 서비스·기능의 단계적 출시","roll + out: 밖으로 펼치다","The rollout will begin next Monday.","새 기능 도입은 다음 주 월요일 시작됩니다."],["Constraint","제약 조건","라틴어 constringere: 함께 단단히 묶다","Budget constraints may delay the project.","예산 제약으로 프로젝트가 지연될 수 있습니다."],["Implication","영향·함의","라틴어 implicare: 안으로 접어 넣다·얽히게 하다","What are the implications for customer support?","고객 지원에 어떤 영향이 있나요?"],["Cadence","업무·회의의 정기적인 주기","라틴어 cadere: 떨어지다에서 발전한 리듬","Let's establish a weekly reporting cadence.","주간 보고 주기를 정합시다."],["Bandwidth","업무를 처리할 여력","band + width: 주파수 대역의 폭에서 확장","Our team has limited bandwidth this week.","이번 주에는 팀의 업무 여력이 부족합니다."],["Buy-in","제안에 대한 동의·지지","buy + in: 참여를 위해 지분을 사다에서 확장","We need leadership buy-in before proceeding.","진행하기 전에 리더십의 지지가 필요합니다."],["Touchpoint","고객·팀과의 접점","touch + point: 접촉하는 지점","We should improve every customer touchpoint.","모든 고객 접점을 개선해야 합니다."],["Follow-through","계획을 끝까지 실행하는 것","follow + through: 끝까지 따라가다","Strong follow-through is essential after the meeting.","회의 후 끝까지 실행하는 것이 중요합니다."]];
const KEY='wordlab_progress_v2';
let fbAuth=null,fbDb=null,fbUser=null,fbFns=null,cloudReady=false,loadingCloud=false,unsubscribeCloud=null;
const authBtn=document.getElementById('authBtn'),syncStatus=document.getElementById('syncStatus');
function status(s,err=false){syncStatus.textContent=s;syncStatus.classList.toggle('error',err)}
function authClick(){if(!fbAuth||!fbFns)return;if(fbUser){fbFns.signOut(fbAuth).catch(e=>status('로그아웃 실패: '+e.code,true))}else{fbFns.signInWithPopup(fbAuth,new fbFns.GoogleAuthProvider()).catch(e=>{status('로그인 실패: '+e.code,true);if(e.code==='auth/unauthorized-domain')alert('Firebase Authentication의 승인된 도메인에 happykdk-stack.github.io를 추가해 주세요.');})}}
window.authClick=authClick;
window.initWordLabFirebase=async function(config,modules){
try{fbFns=modules;const app=modules.initializeApp(config);fbAuth=modules.getAuth(app);fbDb=modules.initializeFirestore(app,{experimentalForceLongPolling:true,useFetchStreams:false});
authBtn.disabled=false;authBtn.textContent='Google 로그인';
modules.onAuthStateChanged(fbAuth,async user=>{
if(unsubscribeCloud){unsubscribeCloud();unsubscribeCloud=null}
fbUser=user;cloudReady=false;
if(!user){authBtn.textContent='Google 로그인';status('이 기기에 저장 중');return}
authBtn.textContent='로그아웃';status('클라우드 연결 중…');loadingCloud=true;
const ref=modules.doc(fbDb,'users',user.uid,'wordlab','progress');
try{
const snap=await modules.getDoc(ref);
const remote=snap.exists()?(snap.data().words||{}):{};
const local=progress;
const merged={...local,...remote};
progress=merged;localStorage.setItem(KEY,JSON.stringify(progress));
const missing={};for(const k of Object.keys(local))if(!(k in remote))missing[k]=local[k];
if(Object.keys(missing).length)await modules.setDoc(ref,{words:missing},{merge:true});
cloudReady=true;status('☁ 동기화 완료');if(mode==='review')tab('review');
unsubscribeCloud=modules.onSnapshot(ref,s=>{
if(!s.exists())return;
const words=s.data().words||{};progress={...progress,...words};localStorage.setItem(KEY,JSON.stringify(progress));
if(mode==='review')tab('review');status('☁ 동기화 완료');
},e=>status('동기화 오류: '+e.code,true));
}catch(e){status('클라우드 오류: '+(e.code||'unknown'),true);if(e.code==='unavailable')alert('Firestore 연결에 실패했습니다. 다른 네트워크(예: 휴대폰 모바일 데이터)에서 재시도해 주세요. 회사망 또는 브라우저 확장 프로그램이 연결을 차단할 수 있습니다.');else if(e.code==='permission-denied')alert('Firestore 보안 규칙이 읽기/쓰기를 허용하지 않습니다. Rules 설정을 확인해야 합니다.');console.error('WordLab Firestore:',e)}
finally{loadingCloud=false}
});
}catch(e){status('Firebase 초기화 실패',true)}
};
function syncWord(key,val){if(!fbUser||!cloudReady||!fbFns)return;status('☁ 저장 중…');const ref=fbFns.doc(fbDb,'users',fbUser.uid,'wordlab','progress');fbFns.setDoc(ref,{words:{[key]:val}},{merge:true}).then(()=>status('☁ 저장 완료')).catch(e=>status('저장 실패: '+e.code,true))}

let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let mode='card',index=0,flipped=false,deck=[],answered=false,score=0,done=0;
const app=document.getElementById('app');document.getElementById('total').textContent=DATA.length+'개 단어';
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tab(m){mode=m;index=0;flipped=false;answered=false;score=0;done=0;deck=m==='review'?shuffle(DATA.filter(x=>progress[x[0].toLowerCase()]==='missed')):m==='quiz'?shuffle(DATA):DATA;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+m));render()}
function render(){if(mode==='quiz')return renderQuiz();if(!deck.length){app.innerHTML='<h2 class="center">복습할 단어가 없습니다 🎉</h2><p class="center small">낱말카드에서 다시 복습할 단어를 표시해 주세요.</p>';return}const x=deck[index];if(!x){app.innerHTML='<h2 class="center">학습 완료!</h2><p class="center">오늘도 수고하셨습니다.</p><button onclick="tab(\'card\')">처음부터 다시</button>';return}app.innerHTML='<div class="meta"><span>'+(mode==='review'?'틀린 단어 복습':'낱말카드')+'</span><span>'+(index+1)+' / '+deck.length+'</span></div><div class="bar"><div class="fill" style="width:'+((index+1)/deck.length*100)+'%"></div></div><div class="card" onclick="flipped=!flipped;render()">'+(flipped?'<div class="meaning">'+esc(x[1])+'</div><div class="origin">'+esc(x[2])+'</div><div class="example">'+esc(x[3])+'</div><div class="ko">'+esc(x[4])+'</div>':'<div class="word">'+esc(x[0])+'</div><div class="hint">카드를 눌러 뜻 · 어원 · 예문 확인</div>')+'</div><div class="controls"><button class="secondary" onclick="prev()" '+(index===0?'disabled':'')+'>← 이전</button><button class="secondary" onclick="speak()">🔊 발음</button><button class="bad" onclick="mark(false)">다시 복습</button><button class="good" onclick="mark(true)">알아요 ✓</button></div>'}
function prev(){index=Math.max(0,index-1);flipped=false;render()}
function mark(ok){progress[deck[index][0].toLowerCase()]=ok?'known':'missed';save();syncWord(deck[index][0].toLowerCase(),ok?'known':'missed');index++;flipped=false;render()}
function speak(){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(deck[index][0]);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}
function options(x){const distractors=shuffle(DATA.filter(y=>y[0]!==x[0])).slice(0,3);return shuffle([x,...distractors])}
function renderQuiz(){if(done>=deck.length){app.innerHTML='<h2 class="center">퀴즈 완료 🎉</h2><p class="center">정답 '+score+' / '+deck.length+'</p><div class="controls"><button onclick="tab(\'quiz\')">다시 도전</button><button class="secondary" onclick="tab(\'review\')">틀린 단어 복습</button></div>';return}const x=deck[done];if(!window.quizOptions||window.quizAt!==done){window.quizOptions=options(x);window.quizAt=done;answered=false}app.innerHTML='<div class="meta"><span>뜻을 보고 영어 단어 고르기</span><span>'+(done+1)+' / '+deck.length+'</span></div><div class="bar"><div class="fill" style="width:'+(done/deck.length*100)+'%"></div></div><div class="card" style="min-height:145px;cursor:default"><div class="meaning">'+esc(x[1])+'</div></div><div id="choices">'+window.quizOptions.map((o,i)=>'<button class="choice" id="choice'+i+'" onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o[0])+'</button>').join('')+'</div><div id="result"></div>'}
function answer(i){if(answered)return;answered=true;const x=deck[done],chosen=window.quizOptions[i],ok=chosen[0]===x[0];if(ok)score++;progress[x[0].toLowerCase()]=ok?'known':'missed';save();syncWord(x[0].toLowerCase(),ok?'known':'missed');window.quizOptions.forEach((o,j)=>{const b=document.getElementById('choice'+j);b.disabled=true;if(o[0]===x[0])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('result').innerHTML='<div class="feedback"><b>'+(ok?'정답입니다!':'다시 기억해 보세요.')+'</b><p><b>'+esc(x[0])+'</b> · '+esc(x[1])+'</p><p>🧬 '+esc(x[2])+'</p><p>'+esc(x[3])+'<br>'+esc(x[4])+'</p></div><button style="width:100%;margin-top:12px" onclick="done++;renderQuiz()">다음 문제 →</button>'}
tab('card');
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
