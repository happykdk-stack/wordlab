const DATA=[["Compensate","손해·불편을 보상하다","라틴어 compensare: 함께 무게를 달다","We will compensate you for the inconvenience.","불편에 대해 보상하겠습니다."],["Reimburse","이미 지출한 비용을 상환하다","프랑스어 bourse: 돈주머니","We will reimburse the customer for shipping.","고객에게 배송비를 상환하겠습니다."],["Quantify","수치화하다","라틴어 quantus: 얼마나 많은","Can you quantify the potential impact?","잠재적인 영향을 수치화할 수 있나요?"],["Bottleneck","병목 지점","bottle + neck: 병의 좁은 목","The approval step is a bottleneck.","승인 단계가 병목 지점입니다."],["Remediate","문제·결함을 시정하다","라틴어 remedium: 치료법","We need to remediate the defect.","결함을 시정해야 합니다."],["Allocate","자원을 배정하다","라틴어 locare: 배치하다","We need to allocate more resources.","자원을 더 배정해야 합니다."],["Redact","민감한 정보를 가리다","라틴어 redigere: 정리하다","Please redact personal information.","개인정보를 가려 주세요."],["Assess","평가하다","라틴어 assidere: 곁에 앉다","We need to assess the impact.","영향을 평가해야 합니다."],["Anticipate","예상하고 대비하다","라틴어 ante + capere: 앞서 잡다","We anticipate more inquiries.","문의가 늘어날 것으로 예상합니다."],["Corroborate","추가 증거로 뒷받침하다","라틴어 corroborare: 강하게 만들다","The inspection report corroborates the claim.","검사 보고서가 주장을 뒷받침합니다."],["Substantiate","증거로 입증하다","라틴어 substantia: 실체","We need evidence to substantiate the claim.","주장을 입증할 증거가 필요합니다."],["Defer","연기하다","라틴어 differre: 뒤로 옮기다","We may defer the system update.","시스템 업데이트를 연기할 수 있습니다."],["Liaise","연락하고 협의하다","프랑스어 liaison: 연결","I will liaise with the IT team.","IT팀과 연락하여 협의하겠습니다."],["Discrepancy","불일치","라틴어 discrepare: 서로 다르게 울리다","We found a discrepancy in the records.","기록에서 불일치를 발견했습니다."],["Reconcile","기록을 대조하여 일치시키다","라틴어 reconciliare: 다시 화합시키다","We need to reconcile the refund records.","환불 기록을 대조하여 일치시켜야 합니다."],["Mitigate","위험이나 영향을 완화하다","라틴어 mitis: 부드러운","We need to mitigate the risk.","위험을 완화해야 합니다."],["Expedite","처리를 신속하게 진행하다","라틴어 expedire: 장애물을 풀다","Could you expedite the refund?","환불을 신속히 진행해 주시겠습니까?"],["Workaround","임시 우회 해결책","work + around: 우회하여 처리하다","Is there a temporary workaround?","임시 우회 해결책이 있나요?"],["Backlog","밀린 미처리 업무","back + log: 뒤쪽의 큰 통나무","We need to clear the backlog.","밀린 업무를 처리해야 합니다."],["Prioritize","우선순위를 정하다","라틴어 prior: 앞선","We should prioritize safety cases.","안전 관련 케이스를 우선 처리해야 합니다."],["Clarify","명확히 설명하다","라틴어 clarus: 밝고 명확한","Could you clarify the policy?","정책을 명확히 설명해 주시겠습니까?"],["Handover","업무 인수인계","hand + over: 손에서 다른 사람에게 넘기다","Please complete the handover before your leave.","휴가 전에 업무 인계를 완료해 주세요."],["Accountability","결과에 대한 책임·설명 책임","accountable + -ity: 책임지는 상태","We need clear accountability for refund approvals.","환불 승인 책임 소재를 명확히 해야 합니다."],["Ownership","업무를 주도적으로 책임지는 태도","own + -ship: 자신의 것으로 맡는 상태","Who will take ownership of this issue?","누가 이 문제를 책임지고 처리할 예정인가요?"],["Deliverable","제출해야 하는 산출물","deliver + -able: 전달할 수 있는 것","The weekly CS report is our key deliverable.","주간 CS 보고서가 주요 산출물입니다."],["Milestone","프로젝트의 주요 단계","mile + stone: 거리 표시 돌","We reached the first milestone of the rollout.","도입 프로젝트의 첫 주요 단계를 달성했습니다."],["Dependency","선행 조건·의존 관계","라틴어 dependere: 매달리다","The launch has a dependency on IT approval.","출시는 IT 승인이라는 선행 조건에 달려 있습니다."],["Feasibility","실행 가능성","feasible + -ity: 실행 가능한 상태","We need to assess the feasibility of this change.","이 변경의 실행 가능성을 평가해야 합니다."],["Trade-off","상충 조건 간 절충","trade + off: 교환하며 일부를 내주다","There is a trade-off between speed and accuracy.","속도와 정확성 사이에는 절충이 필요합니다."],["Scope","업무·프로젝트 범위","그리스어 skopos: 목표·관찰 대상","Is this request within the project scope?","이 요청이 프로젝트 범위에 포함되나요?"],["Actionable","바로 실행할 수 있는","action + -able: 행동으로 옮길 수 있는","Please provide actionable feedback to the team.","팀에 실행 가능한 피드백을 제공해 주세요."],["Stakeholder","이해관계자","stake(이해관계·지분) + holder(보유자)","We should inform all key stakeholders.","주요 이해관계자 모두에게 알려야 합니다."],["Leverage","자원·강점을 활용하다","lever(지렛대)에서 유래한 leverage","We can leverage the existing CS data.","기존 CS 데이터를 활용할 수 있습니다."],["Rollout","새 서비스·기능의 단계적 출시","roll + out: 밖으로 펼치다","The rollout will begin next Monday.","새 기능 도입은 다음 주 월요일 시작됩니다."],["Constraint","제약 조건","라틴어 constringere: 함께 단단히 묶다","Budget constraints may delay the project.","예산 제약으로 프로젝트가 지연될 수 있습니다."],["Implication","영향·함의","라틴어 implicare: 안으로 접어 넣다·얽히게 하다","What are the implications for customer support?","고객 지원에 어떤 영향이 있나요?"],["Cadence","업무·회의의 정기적인 주기","라틴어 cadere: 떨어지다에서 발전한 리듬","Let's establish a weekly reporting cadence.","주간 보고 주기를 정합시다."],["Bandwidth","업무를 처리할 여력","band + width: 주파수 대역의 폭에서 확장","Our team has limited bandwidth this week.","이번 주에는 팀의 업무 여력이 부족합니다."],["Buy-in","제안에 대한 동의·지지","buy + in: 참여를 위해 지분을 사다에서 확장","We need leadership buy-in before proceeding.","진행하기 전에 리더십의 지지가 필요합니다."],["Touchpoint","고객·팀과의 접점","touch + point: 접촉하는 지점","We should improve every customer touchpoint.","모든 고객 접점을 개선해야 합니다."],["Follow-through","계획을 끝까지 실행하는 것","follow + through: 끝까지 따라가다","Strong follow-through is essential after the meeting.","회의 후 끝까지 실행하는 것이 중요합니다."],["Alignment","의견·방향의 일치","프랑스어 aligner: 한 줄로 맞추다","We need alignment on the refund policy.","환불 정책에 대한 의견 일치가 필요합니다."],["Benchmark","비교 평가 기준","bench(작업대) + mark(표시)에서 발전","Let's benchmark our CS response time.","CS 응답 시간을 비교 평가해 봅시다."],["Escalation","상위 담당자에게 문제 이관","escalate: 사다리로 올라가다에서 파생","This complaint requires escalation to the Quality team.","이 불만은 품질팀에 상위 이관해야 합니다."],["Initiative","주도적인 개선 활동","라틴어 initium: 시작","She is leading a customer experience initiative.","그녀는 고객 경험 개선 활동을 이끌고 있습니다."],["Momentum","추진력·진행 동력","라틴어 movere: 움직이다","We need to maintain momentum on this project.","이 프로젝트의 추진력을 유지해야 합니다."],["Onboarding","신규 직원·고객 적응 지원","on board: 배·조직에 탑승하다","We should improve the new agent onboarding process.","신규 상담원 온보딩 절차를 개선해야 합니다."],["Proactive","선제적인","pro-(앞으로) + active(행동하는)","Let's take a proactive approach to recurring issues.","반복 문제에 선제적으로 대응합시다."],["Retention","고객·직원 유지","라틴어 retinere: 붙잡아 두다","Customer retention is a key performance metric.","고객 유지는 핵심 성과 지표입니다."],["Transparency","투명성·정보 공개","라틴어 trans-(통과하여) + parere(드러나다)","We need more transparency about the project timeline.","프로젝트 일정에 대해 더 투명하게 공유해야 합니다."],["Alignment meeting","방향 조율 회의","alignment(일치) + meeting(회의)","Let's schedule an alignment meeting with Global IT.","글로벌 IT팀과 방향 조율 회의를 잡읍시다."],["Escalate","상위 담당자에게 보고하다","영어 escalator와 같은 라틴어 scala(사다리)에서 파생","Please escalate the unresolved complaint to the manager.","해결되지 않은 불만을 관리자에게 보고해 주세요."],["Streamline","절차를 간소화하다","stream(흐름)+line(선), 유선형이라는 뜻에서 확장","We should streamline the return approval process.","반품 승인 절차를 간소화해야 합니다."],["Rectify","잘못을 바로잡다","라틴어 rectus(곧은)+facere(만들다)에서 유래","We must rectify the billing error today.","오늘 청구 오류를 바로잡아야 합니다."],["Delegate","업무를 위임하다","라틴어 delegare(맡기다, 파견하다)에서 유래","I will delegate the follow-up tasks to the team.","후속 업무를 팀에 위임하겠습니다."],["Consolidate","통합하다","라틴어 consolidare(단단하게 만들다)에서 유래","Let's consolidate the weekly reports.","주간 보고서를 통합합시다."],["Facilitate","원활하게 하다","라틴어 facilis(쉬운)에서 유래","This checklist will facilitate onboarding.","이 점검표는 신규 직원 적응을 원활하게 할 것입니다."],["Verify","확인하고 검증하다","라틴어 verus(참된)+facere(만들다)에서 유래","Please verify the order number before issuing a refund.","환불 처리 전에 주문번호를 확인해 주세요."],["Implement","시행하다","라틴어 implementum(도구, 채우는 수단)에서 유래","We will implement the revised workflow next week.","다음 주에 개정된 업무 절차를 시행하겠습니다."],["Resolve","문제를 해결하다","라틴어 resolvere(풀어 주다)에서 유래","We need to resolve this case before Friday.","금요일 전까지 이 건을 해결해야 합니다."],["Coordinate","조율하다","라틴어 co-(함께)+ordinare(질서 있게 정리하다)에서 유래","I'll coordinate the delivery schedule with logistics.","물류팀과 배송 일정을 조율하겠습니다."],["Amend","수정하다","라틴어 emendare(잘못을 고치다)에서 유래","We need to amend the service guidelines.","서비스 지침을 수정해야 합니다."],["Authorize","승인하다·권한을 부여하다","라틴어 auctor(권위자·창시자)에서 유래","Only managers can authorize this refund.","관리자만 이 환불을 승인할 수 있습니다."],["Investigate","조사하다","라틴어 investigare(흔적을 따라가다)에서 유래","We will investigate the reported defect.","보고된 결함을 조사하겠습니다."],["Monitor","지속적으로 살피다","라틴어 monere(경고하다)에서 유래","Please monitor the return rate this week.","이번 주 반품률을 모니터링해 주세요."],["Diagnose","원인을 진단하다","그리스어 dia-(구별하여) + gnosis(앎)","The technician will diagnose the issue.","기술자가 문제의 원인을 진단할 것입니다."],["Document","문서로 기록하다","라틴어 documentum(증거·교훈)에서 유래","Document each step of the repair process.","수리 과정의 각 단계를 문서로 기록하세요."],["Forecast","예측하다","fore-(미리) + cast(던지다)에서 유래","We forecast stronger sales next quarter.","다음 분기 매출 증가를 예상합니다."],["Comply","규정을 준수하다","라틴어 complere(채우다·완수하다)에서 발전","All teams must comply with safety rules.","모든 팀은 안전 규정을 준수해야 합니다."],["Safeguard","보호하다","safe(안전한) + guard(지키다)","We must safeguard customer information.","고객 정보를 보호해야 합니다."],["Negotiate","협상하다","라틴어 negotiari(거래하다)에서 유래","We will negotiate a revised delivery date.","수정된 배송 일정을 협상하겠습니다."]];
const KEY='wordlab_progress_v2';

let firebaseAuth=null,firebaseDb=null,firebaseApi=null,currentUser=null,cloudReady=false,authEpoch=0;
const authBtn=document.getElementById('authBtn'),syncStatus=document.getElementById('syncStatus');
function syncMessage(s,isError=false){syncStatus.textContent=s;syncStatus.classList.toggle('err',isError)}
function authClick(){
if(!firebaseAuth||!firebaseApi)return;
if(currentUser){firebaseApi.signOut(firebaseAuth).catch(e=>syncMessage('로그아웃 오류: '+e.code,true));return}
firebaseApi.signInWithPopup(firebaseAuth,new firebaseApi.GoogleAuthProvider()).catch(e=>syncMessage('로그인 오류: '+(e.code||e.message),true));
}
function errorLabel(e){
const code=String(e.code||e.message||'unknown').replace('firestore/','');
if(code.includes('permission-denied'))return '권한 거부: Firestore 규칙 확인 필요';
if(code.includes('not-found'))return '데이터베이스 ID 확인 필요';
if(code.includes('unavailable'))return '서버 연결 실패: 네트워크 확인 필요';
return '클라우드 오류: '+code;
}
const pendingKey='wordlab_pending_v1';
let metrics={attempts:0,correct:0,cardChecks:0};
let rankOptIn=false,rankNickname='',rankRows=[],rankMessage='',rankRefreshTimer=null;
function metricsKey(){return 'wordlab_metrics_'+(currentUser?currentUser.uid:'guest')}
function readMetrics(){try{return JSON.parse(localStorage.getItem(metricsKey())||'{}')}catch(e){return {}}}
function loadMetrics(){metrics={attempts:0,correct:0,cardChecks:0,...readMetrics()}}
function saveMetrics(){try{localStorage.setItem(metricsKey(),JSON.stringify(metrics))}catch(e){}}
function metricsUpdate(ok,isQuiz){
if(isQuiz){metrics.attempts++;if(ok)metrics.correct++}else metrics.cardChecks++;
saveMetrics();
if(currentUser&&cloudReady)saveCloudMetrics();
}
async function saveCloudMetrics(){
if(!currentUser||!cloudReady)return;
try{await firebaseApi.setDoc(firebaseApi.doc(firebaseDb,'users',currentUser.uid,'wordlab','progress'),{metrics},{merge:true});}catch(e){syncMessage(errorLabel(e),true)}
}
function levelName(n){return n>=45?'마스터':n>=30?'전문가':n>=15?'숙련자':n>=5?'도전자':'새싹'}
function statNumbers(){const values=Object.values(progress);return {known:values.filter(x=>x==='known').length,missed:values.filter(x=>x==='missed').length,attempts:metrics.attempts,correct:metrics.correct}}
function scoreValue(){return statNumbers().known}
function maskedEmail(email){const p=String(email||'').split('@');if(p.length!==2)return '학습자';return p[0].slice(0,p[0].length>3?2:1)+'***@'+p[1]}
function safeRankLabel(entry){const label=String(entry.nickname||'');const at=label.indexOf('@');return at>0&&label.includes('***')&&label.slice(at+1).includes('.')?' '+label.trim():'기존 사용자 (재로그인 필요)'}

async function publishRank(){

const n=statNumbers();

}
async function joinRank(){
if(!currentUser){rankMessage='Google 로그인 후 참여할 수 있습니다.';renderRank();return}

}
async function leaveRank(){

function readPending(){try{return JSON.parse(localStorage.getItem(pendingKey)||'{}')}catch(e){return {}}}
function pendingSave(k,v){const p=readPending();p[k]=v;try{localStorage.setItem(pendingKey,JSON.stringify(p))}catch(e){}}
function pendingClear(){try{localStorage.removeItem(pendingKey)}catch(e){}}
async function pushPending(){
if(!currentUser||!firebaseDb||!firebaseApi)return;
const pending=readPending();if(!Object.keys(pending).length)return;
const ref=firebaseApi.doc(firebaseDb,'users',currentUser.uid,'wordlab','progress');
await firebaseApi.setDoc(ref,{words:pending},{merge:true});pendingClear();if(rankOptIn)await publishRank();
}
function recordProgress(word,value,isQuiz=false){
metricsUpdate(value==='known',isQuiz);
const k=word.toLowerCase();progress[k]=value;save();pendingSave(k,value);
if(!currentUser||!cloudReady)return;
syncMessage('☁ 저장 중…');
pushPending().then(()=>syncMessage('☁ 동기화 완료')).catch(e=>syncMessage(errorLabel(e),true));
}
async function syncFromCloud(){
if(!currentUser||!firebaseDb)return;
const user=currentUser,epoch=authEpoch,ref=firebaseApi.doc(firebaseDb,'users',user.uid,'wordlab','progress');
try{
syncMessage('☁ 연결 중…');
const snapshot=await firebaseApi.getDoc(ref);
if(epoch!==authEpoch)return;
const remote=snapshot.exists()?(snapshot.data().words||{}):{};
const remoteMetrics=snapshot.exists()?(snapshot.data().metrics||{}):{};
metrics={...metrics,attempts:Math.max(metrics.attempts||0,remoteMetrics.attempts||0),correct:Math.max(metrics.correct||0,remoteMetrics.correct||0),cardChecks:Math.max(metrics.cardChecks||0,remoteMetrics.cardChecks||0)};saveMetrics();
const local={...progress},pending=readPending();
const missing={};for(const [k,v] of Object.entries(local))if(!(k in remote))missing[k]=v;
progress={...local,...remote,...pending};save();
const upload={...missing,...pending};
if(Object.keys(upload).length){await firebaseApi.setDoc(ref,{words:upload},{merge:true});pendingClear()}
if(epoch!==authEpoch)return;
cloudReady=true;syncMessage('☁ 동기화 완료');
try{const rankDoc=await firebaseApi.getDoc(firebaseApi.doc(firebaseDb,'leaderboard',user.uid));if(epoch!==authEpoch)return;rankOptIn=rankDoc.exists();if(rankOptIn)await publishRank()}catch(e){console.warn('Rank check:',e)}
if(mode==='stats')renderStats();
if(mode==='review')tab('review');
}catch(e){cloudReady=false;syncMessage(errorLabel(e),true);console.error('WordLab cloud sync',e)}
}

if(!user){authBtn.textContent='Google 로그인';syncMessage('PC에 저장 중');loadMetrics();rankOptIn=false;rankRows=[];if(mode==='stats'||mode==='rank')render();return}

};

function stopReviewVoice(){
reviewVoiceToken++;
if(reviewAutoTimer!==null){clearTimeout(reviewAutoTimer);reviewAutoTimer=null}
if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){}
}
function speakReviewPair(){
if(mode!=='review'||!deck[index])return;
stopReviewVoice();
const word=deck[index],token=reviewVoiceToken,auto=reviewAutoPlay;
const valid=()=>mode==='review'&&reviewVoiceToken===token&&deck[index]===word;
if(!('speechSynthesis' in window)){
if(auto)reviewAutoTimer=setTimeout(()=>{if(!valid()||!reviewAutoPlay)return;index=(index+1)%deck.length;flipped=false;render();speakReviewPair()},4500);

}
let fallback=null,phase=0;
const clearFallback=()=>{if(fallback!==null){clearTimeout(fallback);fallback=null}};
const next=()=>{
if(!valid()||!auto||phase>=3)return;

};
const korean=()=>{

try{const ko=new SpeechSynthesisUtterance(word[1]);ko.lang='ko-KR';ko.rate=.94;ko.volume=.8;ko.onend=next;ko.onerror=next;speechSynthesis.speak(ko);

}catch(e){next()}
};
try{

}catch(e){if(auto)korean()}
}
