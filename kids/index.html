 if(!reviewAutoPlaying||mode!=='review'||transitionLocked||!deck[index]){
  stopReviewAutoPlay();return;
 }
 if(!('speechSynthesis' in window)){stopReviewAutoPlay();return}
 clearReviewAutoTimers();
 const word=deck[index],wordIndex=index,session=reviewAutoToken;
 const active=()=>reviewAutoPlaying&&reviewAutoToken===session&&mode==='review'&&index===wordIndex&&deck[index]===word;
 let phase='english';
 const schedule=(fn,ms)=>{
  if(reviewAutoTimer!==null)clearTimeout(reviewAutoTimer);
  reviewAutoTimer=setTimeout(()=>{reviewAutoTimer=null;if(active())fn()},ms);
 };
 const watchdog=(fn,ms)=>{
  if(reviewAutoWatchdog!==null)clearTimeout(reviewAutoWatchdog);
  reviewAutoWatchdog=setTimeout(()=>{reviewAutoWatchdog=null;if(active())fn()},ms);
 };
 const advance=()=>{
  if(!active()||phase!=='advance')return;
  clearReviewAutoTimers();
  index=(index+1)%deck.length;
  flipped=false;
  render();
  // Do not reuse the previous card's index-based guard for the new card.
  reviewAutoTimer=setTimeout(()=>{
   reviewAutoTimer=null;
   if(reviewAutoPlaying&&reviewAutoToken===session&&mode==='review')playReviewSequence();
  },450);
 };
 const koreanEnded=()=>{
  if(!active()||phase!=='korean')return;
  phase='advance';
  if(reviewAutoWatchdog!==null){clearTimeout(reviewAutoWatchdog);reviewAutoWatchdog=null}
  schedule(advance,700);
 };
 const playKorean=()=>{
  if(!active()||phase!=='english')return;
  phase='korean';
  if(reviewAutoWatchdog!==null){clearTimeout(reviewAutoWatchdog);reviewAutoWatchdog=null}
  flipped=true;
  render();
  // The Korean voice is queued after English without cancelling the engine.
  try{
   const ko=kidsUtterance(word[1],'ko-KR',.87);
   ko.onend=koreanEnded;ko.onerror=koreanEnded;
   if(speechSynthesis.paused)speechSynthesis.resume();
   kidsStartSpeech(ko);
   watchdog(koreanEnded,Math.max(5000,word[1].length*420+2300));
  }catch(e){koreanEnded()}
 };
 try{
  const en=kidsUtterance(word[0],'en-US',.82);
  en.onend=()=>{if(active()&&phase==='english')schedule(playKorean,250)};
  en.onerror=()=>{if(active()&&phase==='english')schedule(playKorean,250)};
  if(speechSynthesis.paused)speechSynthesis.resume();
  kidsStartSpeech(en);
  // Some mobile browsers fail to send onend; move forward only after generous fallback.
  watchdog(playKorean,Math.max(4800,word[0].length*360+2300));
 }catch(e){schedule(playKorean,250)}
}

function speakNatural(text,lang='en-US',rate=.94){

function makeFanfareWav(){

const notes=[{f:523.25,s:0,e:.17},{f:659.25,s:.17,e:.34},{f:783.99,s:.34,e:.68}];
for(let i=0;i<samples;i++){const t=i/rate;let y=0;for(const n of notes){if(t<n.s||t>=n.e)continue;const d=t-n.s,len=n.e-n.s,env=Math.min(1,d/.016)*Math.min(1,(len-d)/.055);y+=env*(Math.sin(2*Math.PI*n.f*d)*.55+Math.sin(2*Math.PI*n.f*2*d)*.13)}v.setInt16(44+i*2,Math.max(-32767,Math.min(32767,Math.round(y*16000))),true)}

}

{hz:523.25,start:.18,dur:.16},
{hz:659.25,start:.36,dur:.17},

gain.gain.setValueAtTime(vol*.75,t+n.dur*.65);
gain.gain.exponentialRampToValueAtTime(.0001,t+n.dur);
osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+n.dur+.01);
});
});

}catch(e){}
}
