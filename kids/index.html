<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordLab Kids | 그림 영어 놀이터</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#24324e;background:#f7f6ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:730px;margin:auto;padding:10px 14px 42px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0}h1{margin:0;font-size:27px;color:#5b49b8}h2{font-size:21px}.sub{color:#7b7b99;font-size:13px}.chip{background:#e9e3ff;color:#5545b0;border-radius:40px;padding:8px 12px;font-weight:700;font-size:12px}.grades,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.grades button,.tabs button{flex:1;min-width:95px}button{border:0;background:#7865dc;color:white;border-radius:14px;padding:12px 13px;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.4}.grades button,.tabs button{background:#eae6fc;color:#6051a4}.grades button.active,.tabs button.active{background:#7865dc;color:white}.panel{background:white;border:1px solid #eeeafa;border-radius:23px;padding:21px;box-shadow:0 10px 30px #4433980b}.meta{display:flex;justify-content:space-between;color:#777894;font-size:13px;margin-bottom:12px}.bar{height:9px;border-radius:30px;background:#eeeafb;overflow:hidden;margin-bottom:15px}.bar span{display:block;height:100%;background:#63c7ac}.flash{min-height:300px;background:linear-gradient(135deg,#f9f3ff,#eaf7ff);border:2px solid #e7e0fb;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;gap:11px}.emoji{font-size:92px;line-height:1.25}.word{font-size:36px;font-weight:850;color:#4c43a0}.meaning{font-size:26px;font-weight:750}.hint{font-size:13px;color:#8585a4}.sentence{font-size:16px}.actions button{flex:1}.secondary{background:#eae6fc;color:#5546a4}.success{background:#25a880}.danger{background:#e97989}.choice{display:block;width:100%;background:#f1effb;color:#342f62;text-align:left;margin:9px 0}.choice.right{background:#d6f5e8}.choice.wrong{background:#ffe1e5}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:#f2effe;border-radius:16px;padding:16px}.stat b{display:block;font-size:29px;margin-top:6px}.stat small{color:#777894}.notice{background:#f2effe;border-radius:14px;padding:13px;color:#5c5585;font-size:13px;line-height:1.6}.rankrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px solid #eeeafa}.rankrow:last-child{border-bottom:0}.rankrow strong{font-size:14px}.formrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.formrow input{min-width:120px;flex:1;border:1px solid #ded8f2;border-radius:12px;padding:12px;font:inherit}.formrow button{flex:0 0 auto}.profile-menu{position:relative;min-width:160px;text-align:right}.profile-trigger{width:100%;background:#eae6fc;color:#5546a4}.profile-dropdown{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:white;border:1px solid #ded8f2;border-radius:16px;box-shadow:0 12px 30px #35206a24;padding:12px;width:min(280px,88vw);text-align:left}.profile-dropdown[hidden]{display:none}.profile-dropdown .formrow{margin:8px 0}.profile-dropdown button{width:100%;text-align:left}.profile-dropdown input{width:100%}.profile-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #d9d1fb;border-radius:999px;padding:10px 14px;background:linear-gradient(135deg,#f4efff,#e8e4ff);color:#493c9a;font-weight:800;box-shadow:0 3px 10px #6c58c61c;transition:transform .15s,box-shadow .15s}.profile-trigger:hover{transform:translateY(-1px);box-shadow:0 5px 15px #6c58c62a}.profile-dropdown{border-radius:20px;border:1px solid #e6dffc;box-shadow:0 18px 45px #37237e24;padding:14px}.profile-dropdown .profile-heading{font-size:13px;color:#6d648c;font-weight:800;margin-bottom:10px}.profile-dropdown .profile-option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;margin:5px 0;border-radius:13px;background:#f6f3ff;color:#52458d;font-weight:700}.profile-dropdown .profile-option.is-current{background:#7764d9;color:white}.profile-dropdown .profile-add{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px dashed #ad9fec;background:#f6f3ff;color:#6652c0;border-radius:13px;font-size:25px;padding:0}.profile-dropdown .profile-add:hover{background:#ebe4ff}.profile-dropdown .profile-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eee9fa;padding-top:11px;margin-top:10px}.card-answer-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.card-answer-actions button{min-height:76px;padding:18px 12px;border-radius:20px;font-size:21px;font-weight:850;touch-action:manipulation;box-shadow:0 5px 13px #2c225015}.card-answer-actions button:active{transform:scale(.98)}.login-gate{text-align:center;padding:36px 18px}.login-gate h2{margin:8px 0}.login-gate p{color:#777894;line-height:1.7}.login-gate button{min-height:54px;padding:15px 25px;font-size:17px}.footer{text-align:center;color:#8b8ba4;font-size:12px;margin-top:12px}@media(max-width:480px){h1{font-size:25px}.panel{padding:14px}.flash{min-height:265px}.emoji{font-size:75px}.word{font-size:30px}}
</style></head><body><div class="wrap"><header><div><h1>🌈 WordLab Kids</h1><div class="sub">그림으로 배우는 신나는 영어!</div></div><div style="display:flex;flex-direction:column;gap:3px;align-items:end"><div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap"><button id="loginBtn" class="secondary" type="button">Google 로그인</button><div id="profileBar" class="profile-menu"></div></div><span id="cloudStatus" class="sub">이 기기에 저장 중</span></div></header><div class="grades"><button id="g1-2" onclick="setGrade('1-2')">🌱 1~2학년</button><button id="g3-4" onclick="grade('3-4')">🌼 3~4학년</button><button id="g5-6" onclick="grade('5-6')">🚀 5~6학년</button></div><div class="tabs"><button id="tcard" data-tab="card">🃏 낱말카드</button><button id="tquiz" data-tab="quiz">🎯 퀴즈</button><button id="treview" data-tab="review">🔁 다시 복습</button><button id="tstats" data-tab="stats">⭐ 내 통계</button><button id="trank" data-tab="rank">🏆 친구 순위</button></div><main id="app" class="panel"></main><div class="footer">로그인 시 학습 기록을 동기화할 수 있습니다. 친구 순위 참여는 선택 사항입니다.</div></div><script>
const DATA={"1-2":[["Apple","사과","🍎","I eat an apple."],["Banana","바나나","🍌","I like bananas."],["Cat","고양이","🐱","The cat is cute."],["Dog","강아지","🐶","The dog runs."],["Bird","새","🐦","A bird can fly."],["Fish","물고기","🐟","I see a fish."],["Sun","태양","☀️","The sun is bright."],["Moon","달","🌙","Look at the moon."],["Star","별","⭐","I see a star."],["Book","책","📚","This is my book."],["Pencil","연필","✏️","I have a pencil."],["School","학교","🏫","I go to school."],["House","집","🏠","This is my house."],["Car","자동차","🚗","The car is red."],["Bus","버스","🚌","I take the bus."],["Flower","꽃","🌸","The flower is pink."],["Tree","나무","🌳","The tree is tall."],["Milk","우유","🥛","I drink milk."],["Bread","빵","🍞","I eat bread."],["Ball","공","⚽","Kick the ball."]],"3-4":[["Weather","날씨","🌤️","The weather is nice."],["Rainbow","무지개","🌈","I see a rainbow."],["Mountain","산","⛰️","We climb the mountain."],["River","강","🏞️","The river is long."],["Library","도서관","📖","I read at the library."],["Hospital","병원","🏥","The hospital is near."],["Bicycle","자전거","🚲","I ride my bicycle."],["Breakfast","아침 식사","🥣","I eat breakfast early."],["Vegetable","채소","🥕","Vegetables are healthy."],["Adventure","모험","🧭","We go on an adventure."],["Friendship","우정","🤝","Friendship is important."],["Excited","신이 난","🎉","I am excited today."],["Careful","조심하는","⚠️","Be careful on the stairs."],["Quiet","조용한","🤫","Please be quiet."],["Different","다른","🧩","We have different ideas."],["Together","함께","👫","Let's work together."],["Practice","연습하다","🎯","I practice English."],["Explore","탐험하다","🔭","We explore the forest."],["Describe","묘사하다","🖼️","Describe your favorite animal."],["Compare","비교하다","⚖️","Compare the two pictures."]],"5-6":[["Environment","환경","🌍","We should protect the environment."],["Pollution","오염","🏭","Pollution harms animals."],["Recycle","재활용하다","♻️","We recycle paper."],["Energy","에너지","⚡","Solar panels produce energy."],["Discover","발견하다","🔎","Scientists discover new things."],["Experiment","실험","🧪","We did a science experiment."],["Evidence","증거","🕵️","Look for evidence."],["Solution","해결책","💡","We found a solution."],["Challenge","도전","🧗","This challenge is difficult."],["Opportunity","기회","🚪","This is a great opportunity."],["Responsibility","책임","🎒","Taking care of pets is a responsibility."],["Cooperate","협력하다","🤝","We cooperate on the project."],["Communicate","소통하다","💬","We communicate clearly."],["Creative","창의적인","🎨","She has a creative idea."],["Confident","자신감 있는","🦁","I feel confident today."],["Curious","호기심 많은","🔍","Curious students ask questions."],["Improve","향상시키다","📈","I want to improve my English."],["Organize","정리하다","🗂️","Let's organize our notes."],["Predict","예측하다","🔮","Can you predict the weather?"],["Achievement","성취","🏆","Finishing the book is an achievement."]]};
const PREFIX='wordlabkids_v1_';
let level='1-2',mode='card',index=0,flipped=false,deck=[],choices=[],answered=false,score=0;
let auth=null,db=null,fb=null,user=null,cloudReady=false,authVersion=0;
let rankJoined=false,rankAlias='',rankGrade='1-2',rankRows=[],rankError='',rankTimer=null,quizFinishGrade='1-2',quizFinishScore=0,completionSavedKey='';
let profiles=[],activeProfile=null,profileEpoch=0,profileSyncReady=false;
const ADMIN_EMAIL='happykdk@gmail.com';
const isKidsAdmin=()=>!!user&&user.email===ADMIN_EMAIL&&user.emailVerified===true;
const app=document.getElementById('app');
const loginBtn=document.getElementById('loginBtn');
const cloudStatus=document.getElementById('cloudStatus');
const legacyKey=g=>PREFIX+g;
const legacyStatsKey=g=>PREFIX+'stats_'+g;
const profilePrefix=()=>PREFIX+'profile_'+(user?user.uid:'local')+'_'+(activeProfile?activeProfile.id:'none')+'_';
const localKey=g=>profilePrefix()+g;
const statsKey=g=>profilePrefix()+'stats_'+g;
function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function state(){return read(localKey(level))}
function stats(){return read(statsKey(level))}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function status(t){cloudStatus.textContent=t}
function gradeName(g){return g==='1-2'?'1~2학년':g==='3-4'?'3~4학년':g==='5-6'?'5~6학년':'학년 미등록'}
function gradeKnown(g){return Object.values(read(localKey(g))).filter(v=>v==='known').length}
function profileListKey(){return PREFIX+'profiles_'+(user?user.uid:'local')}
function saveProfiles(){write(profileListKey(),profiles)}
function renderProfileBar(){
const el=document.getElementById('profileBar');if(!el)return;
el.dataset.keepClosed='false';
el.innerHTML='<button id="profileTrigger" type="button" class="profile-trigger" aria-haspopup="true" aria-expanded="false"><span>👦 '+(activeProfile?esc(activeProfile.name):'학습자 선택')+'</span><span>⌄</span></button>'+
'<div class="profile-dropdown" hidden><div class="profile-heading">🌈 누구의 기록으로 공부할까요?</div>'+
profiles.map(p=>'<button type="button" class="profile-option '+(activeProfile&&p.id===activeProfile.id?'is-current':'')+'" data-profile="'+esc(p.id)+'"><span>👤 '+esc(p.name)+'</span><span>'+(activeProfile&&p.id===activeProfile.id?'✓':'')+'</span></button>').join('')+
'<div class="profile-footer"><span class="sub">새 학습자 추가</span><button type="button" id="addProfile" class="profile-add" aria-label="새 프로필 추가" title="새 프로필 추가">+</button></div></div>';
const trigger=el.querySelector('#profileTrigger'),dropdown=el.querySelector('.profile-dropdown');
trigger.addEventListener('click',()=>{dropdown.hidden=!dropdown.hidden;trigger.setAttribute('aria-expanded',String(!dropdown.hidden))});
el.querySelectorAll('[data-profile]').forEach(b=>b.addEventListener('click',()=>{dropdown.hidden=true;trigger.setAttribute('aria-expanded','false');el.dataset.keepClosed='true';chooseProfile(b.dataset.profile)}));
el.querySelector('#addProfile').addEventListener('click',()=>{dropdown.hidden=true;trigger.setAttribute('aria-expanded','false');addProfile()});
}
document.addEventListener('click',e=>{
const el=document.getElementById('profileBar');if(!el||el.contains(e.target))return;
const dropdown=el.querySelector('.profile-dropdown'),trigger=el.querySelector('#profileTrigger');
if(dropdown)dropdown.hidden=true;if(trigger)trigger.setAttribute('aria-expanded','false');
});
async function addProfile(){
const input=prompt('새 학습자 이름 또는 별명을 입력해 주세요 (12자 이내)');if(input===null)return;const name=input.trim();
if(!name||name.length>12){alert('이름을 1~12글자로 입력해 주세요.');return}
const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
profiles.push({id,name});saveProfiles();await saveProfileListCloud();await chooseProfile(id);
}
async function saveProfileListCloud(){
if(!user||!fb||!db)return;
try{await fb.setDoc(fb.doc(db,'users',user.uid,'wordlab','kidsProfiles'),{profiles},{merge:true})}catch(e){status('프로필 목록 저장 오류: '+(e.code||e.message))}
}
async function chooseProfile(id){
const p=profiles.find(x=>x.id===id);if(!p)return;
const version=++profileEpoch;activeProfile=p;profileSyncReady=false;
try{localStorage.setItem(PREFIX+'active_'+(user?user.uid:'local'),id)}catch(e){}
renderProfileBar();switchTab('card');
if(!user||!fb||!db){profileSyncReady=true;return}
status('☁ '+p.name+' 기록 불러오는 중…');
try{
const snap=await fb.getDoc(fb.doc(db,'users',user.uid,'wordlab','kidsProfile_'+id));
if(version!==profileEpoch)return;
const remote=snap.exists()?snap.data():{};
for(const g of Object.keys(DATA)){
const local=read(localKey(g));const remoteWords=remote.grades?.[g]||{};
write(localKey(g),{...remoteWords,...local});
const t=read(statsKey(g)),rt=remote.statistics?.[g]||{};
write(statsKey(g),{attempts:Math.max(t.attempts||0,rt.attempts||0),correct:Math.max(t.correct||0,rt.correct||0),cardChecks:Math.max(t.cardChecks||0,rt.cardChecks||0)});
}
profileSyncReady=true;status('☁ '+p.name+' 기록 준비 완료');switchTab('card');
}catch(e){profileSyncReady=true;status('기기 저장 모드 · '+(e.code||e.message));switchTab('card')}
}
async function loadProfiles(){
const version=++profileEpoch;const local=read(profileListKey());profiles=Array.isArray(local)?local:[];
if(user&&fb&&db){
try{const snap=await fb.getDoc(fb.doc(db,'users',user.uid,'wordlab','kidsProfiles'));if(version!==profileEpoch)return;
const remote=snap.exists()?snap.data().profiles||[]:[];
profiles=[...remote,...profiles.filter(p=>!remote.some(r=>r.id===p.id))];saveProfiles();
}catch(e){status('프로필 목록 동기화 오류: '+(e.code||e.message))}
}
const preferred=localStorage.getItem(PREFIX+'active_'+(user?user.uid:'local'));
renderProfileBar();
if(profiles.length)await chooseProfile(profiles.some(p=>p.id===preferred)?preferred:profiles[0].id);
else{activeProfile=null;profileSyncReady=false;switchTab('card')}
}
function scoreDocId(uid,g,name){return uid+'_'+g+'_'+encodeURIComponent(name.trim().toLowerCase())}
async function refreshKidsRank(){
if(mode!=='rank')return;
if(!user||!fb||!db){rankRows=[];rankError='Google 로그인 후 친구 순위를 확인할 수 있어요.';render();return}
try{const snap=await fb.getDocs(fb.collection(db,'kidsQuizScores'));rankRows=snap.docs.map(d=>({id:d.id,...d.data()})).filter(d=>d.grade===level).sort((a,b)=>(b.correct||0)-(a.correct||0)||(a.updatedAt||0)-(b.updatedAt||0)).slice(0,30);rankError='☁ 순위 데이터 조회 완료 · '+gradeName(level)+' '+rankRows.length+'명'}
catch(e){rankRows=[];rankError='순위표 권한 설정 필요: '+(e.code||'unknown')}render()
}
async function adminDeleteScore(id){
if(!isKidsAdmin()||!fb||!db){rankError='관리자 계정으로 로그인해야 삭제할 수 있어요.';render();return}
const entry=rankRows.find(r=>r.id===id);if(!entry)return;
if(!confirm('['+gradeName(entry.grade)+'] '+entry.name+'의 친구 순위 기록을 삭제할까요? 학습 기록과 복습은 삭제되지 않습니다.'))return;
try{await fb.deleteDoc(fb.doc(db,'kidsQuizScores',id));rankError='순위 기록을 삭제했습니다.';await refreshKidsRank()}
catch(e){rankError='삭제 실패: '+(e.code||e.message||'unknown')+' · Firebase 규칙의 관리자 삭제 권한을 확인하세요.';render()}
}
async function submitCompletion(){
if(!activeProfile)return;
const name=activeProfile.name,grade=level,correct=mode==='quiz'?score:gradeKnown(level);
const key=(user?user.uid:'local')+'_'+activeProfile.id+'_'+grade+'_'+mode+'_'+correct;
if(completionSavedKey===key)return;
completionSavedKey=key;
const msg=app.querySelector('#submitMessage');
if(!user||!fb||!db){if(msg)msg.textContent='기기에 학습 기록을 저장했습니다. 순위 자동 등록은 Google 로그인이 필요합니다.';return}
if(msg)msg.textContent='☁ '+name+' 이름으로 순위 자동 등록 중…';
try{
const id=scoreDocId(user.uid,grade,name),ref=fb.doc(db,'kidsQuizScores',id);
const old=await fb.getDoc(ref);const previous=old.exists()?Number(old.data().correct||0):0;
const best=Math.max(previous,correct);
await fb.setDoc(ref,{ownerUid:user.uid,grade,name,correct:best,total:DATA[grade].length,updatedAt:Date.now()});
if(msg)msg.textContent='🏆 '+name+' 순위 자동 등록 완료 · 최고 '+best+'개';
}catch(e){completionSavedKey='';if(msg)msg.textContent='순위 자동 등록 오류: '+(e.code||e.message||'unknown')}
}
function resetReview(){
if(!activeProfile||mode!=='review')return;
if(!confirm(activeProfile.name+'의 '+gradeName(level)+' 복습 목록을 초기화할까요? 틀린 단어 표시만 지워지며 다른 학습자의 기록은 유지됩니다.'))return;
const s=state();for(const k of Object.keys(s))if(s[k]==='missed')delete s[k];
write(localKey(level),s);sync();switchTab('review');
}
function sync(){
if(!activeProfile)return;
if(!user||!fb||!db||!profileSyncReady)return;
const uid=user.uid,id=activeProfile.id,g=level,words=state(),statistics=stats();
const ref=fb.doc(db,'users',uid,'wordlab','kidsProfile_'+id);
status('☁ '+activeProfile.name+' 저장 중…');
fb.setDoc(ref,{grades:{[g]:words},statistics:{[g]:statistics}},{merge:true}).then(()=>status('☁ 학습 기록 저장 완료')).catch(e=>status('기기 저장됨 · 클라우드 오류: '+(e.code||e.message)));
}
function setGrade(g){
if(!DATA[g])return;
level=g;document.querySelectorAll('.grades button').forEach(b=>b.classList.toggle('active',b.id==='g'+g));switchTab('card');
}
function switchTab(m){
mode=m;index=0;flipped=false;choices=[];answered=false;score=0;completionSavedKey='';
deck=m==='review'?DATA[level].filter(x=>state()[x[0]]==='missed'):m==='quiz'?shuffle(DATA[level]):DATA[level];
document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===m));
render();
if(rankTimer){clearInterval(rankTimer);rankTimer=null}if(m==='rank'){refreshKidsRank();rankTimer=setInterval(()=>{if(mode==='rank')refreshKidsRank()},30000)}
}
function progressHeader(){return '<div class="meta"><span>'+esc(level)+'학년</span><span>'+(index+1)+' / '+deck.length+'</span></div><div class="bar"><span style="width:'+Math.round((index+1)/deck.length*100)+'%"></span></div>'}
function render(){
if(!user){app.innerHTML='<div class="login-gate"><div style="font-size:50px">🔐</div><h2>로그인하고 영어 공부 시작!</h2><p>Google 계정으로 로그인하면 아이별 학습 기록과 복습을 관리할 수 있어요.</p><button type="button" data-action="login-now">Google 로그인하기</button></div>';return}
if(!activeProfile){app.innerHTML='<h2>🌈 학습자를 선택해 주세요</h2><p>위에서 아이 이름을 추가하거나 선택하면 낱말카드와 복습이 시작됩니다.</p>';return}
if(mode==='rank'){
app.innerHTML='<h2>🏆 '+gradeName(level)+' 퀴즈 순위</h2><p class="sub">메인에서 선택한 학년의 최고 정답 수만 비교해요. 퀴즈를 모두 푼 뒤 이름을 등록할 수 있습니다.</p>'+
'<div class="notice">현재 선택: '+gradeName(level)+' · 총 '+DATA[level].length+'문제</div>'+
'<p class="sub">'+esc(rankError)+'</p>'+
(rankRows.length?rankRows.map((r,i)=>'<div class="rankrow"><span><strong>'+((i>0&&Number(rankRows[i-1].correct||0)===Number(r.correct||0))||rankRows.slice(0,i).some(x=>Number(x.correct||0)===Number(r.correct||0))?'공동 ':'')+(1+new Set(rankRows.slice(0,i).filter(x=>Number(x.correct||0)>Number(r.correct||0)).map(x=>Number(x.correct||0))).size)+'위 · '+esc(r.name||'영어 탐험가')+'</strong><div class="sub">'+gradeName(r.grade)+'</div></span><div style="display:flex;align-items:center;gap:8px"><strong>'+Number(r.correct||0)+' / '+Number(r.total||DATA[level].length)+'개</strong>'+(isKidsAdmin()?'<button class="secondary" style="padding:7px 9px" data-action="delete-rank" data-entry="'+esc(r.id)+'" aria-label="순위 기록 삭제">🗑 삭제</button>':'')+'</div></div>').join(''):'<p class="sub">이 학년의 순위 기록이 아직 없어요. 첫 기록을 남겨보세요!</p>');return}
if(mode==='stats'){const s=state(),t=stats(),known=Object.values(s).filter(v=>v==='known').length,missed=Object.values(s).filter(v=>v==='missed').length,pct=t.attempts?Math.round((t.correct||0)/t.attempts*100):0;
app.innerHTML='<h2>⭐ 나의 영어 성장 기록</h2><div class="stats">'+[['학습 완료',known+'개'],['복습할 단어',missed+'개'],['퀴즈 정답률',pct+'%'],['푼 문제',t.attempts||0]].map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><div class="notice" style="margin-top:18px">🌟 '+(known>=18?'영어 탐험왕!':known>=10?'멋진 영어 탐험가!':known>=3?'반짝반짝 성장 중!':'오늘 첫 단어부터 시작해요!')+'</div>';return}
if(mode==='review'&&deck.length){/* review controls shown above cards */}
if(!deck.length){app.innerHTML='<h2>🎉 복습할 단어가 없어요!</h2><p>다시 공부할 단어를 선택해 보세요.</p>'+(mode==='review'?'<button class="secondary" data-action="reset-review">🔄 복습 목록 초기화</button>':'');return}
if(index>=deck.length){
quizFinishGrade=level;quizFinishScore=mode==='quiz'?score:gradeKnown(level);
app.innerHTML='<h2>🏆 학습 완료!</h2><div class="notice">'+gradeName(level)+' · '+(mode==='quiz'?'퀴즈 정답':'낱말카드 학습 완료')+' <b>'+quizFinishScore+' / '+DATA[level].length+'개</b></div>'+
'<p class="sub">현재 학습자 <b>'+esc(activeProfile.name)+'</b> 이름으로 순위를 자동 등록합니다.</p><p id="submitMessage" class="sub"></p>'+
'<div class="notice" style="margin-top:14px">마지막 단어까지 완료했어요. 별도 등록 버튼 없이 자동 저장됩니다.</div>';
submitCompletion();return}
const x=deck[index];
if(mode==='quiz'){
if(!choices.length){choices=shuffle([x,...shuffle(DATA[level].filter(y=>y[0]!==x[0])).slice(0,3)]);answered=false}
app.innerHTML=progressHeader()+'<div class="flash" style="min-height:190px"><div class="emoji">'+x[2]+'</div><div class="meaning">이 그림의 영어 단어는?</div></div><div id="choices">'+choices.map((c,i)=>'<button class="choice" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(c[0])+'</button>').join('')+'</div><div id="feedback"></div>';return
}
app.innerHTML=(mode==='review'?'<div class="actions"><button class="secondary" data-action="reset-review">🔄 복습 목록 초기화</button></div>':'')+progressHeader()+'<div class="flash" data-action="flip">'+(flipped?'<div class="emoji">'+x[2]+'</div><div class="meaning">'+esc(x[1])+'</div><div class="sentence">'+esc(x[3])+'</div><div class="hint">다시 누르면 영어가 나와요</div>':'<div class="emoji">'+x[2]+'</div><div class="word">'+esc(x[0])+'</div><div class="hint">카드를 눌러 뜻을 확인해요</div>')+'</div><div class="actions"><button class="secondary" data-action="speak">🔊 발음 듣기</button></div><div class="card-answer-actions"><button class="danger" data-action="miss">🤔 몰라요</button><button class="success" data-action="known">😊 알아요 ✓</button></div><div class="actions"><button class="secondary" data-action="prev" '+(index===0?'disabled':'')+'>← 이전</button>'+(index===deck.length-1?'':'<button class="secondary" data-action="next">다음 →</button>')+'</div>'+(mode==='card'&&index===deck.length-1?'<div class="notice" style="margin-top:12px">마지막 카드입니다! <b>알아요 ✓</b> 또는 <b>다시 공부</b>를 누르면 자동으로 학습 완료 및 순위 저장이 진행됩니다.</div>':'');
}
function mark(ok){
const x=deck[index],s=state();s[x[0]]=ok?'known':'missed';write(localKey(level),s);
const t=stats();t.cardChecks=(t.cardChecks||0)+1;write(statsKey(level),t);sync();index++;flipped=false;render();
}
function answer(i){
if(answered)return;answered=true;const x=deck[index],ok=choices[i][0]===x[0];if(ok)score++;
const s=state();s[x[0]]=ok?'known':'missed';write(localKey(level),s);
const t=stats();t.attempts=(t.attempts||0)+1;t.correct=(t.correct||0)+(ok?1:0);write(statsKey(level),t);sync();
choices.forEach((c,j)=>{const b=app.querySelector('[data-answer="'+j+'"]');b.disabled=true;if(c[0]===x[0])b.classList.add('right');else if(j===i)b.classList.add('wrong')});
app.querySelector('#feedback').innerHTML='<div class="notice">'+(ok?'정답! ⭐':'다음엔 맞힐 수 있어요! 💛')+' <b>'+esc(x[0])+'</b> = '+esc(x[1])+'<p>'+esc(x[3])+'</p></div><div class="actions"><button data-action="quiz-next">'+(index===deck.length-1?'🏆 퀴즈 완료 · 순위 등록하기':'다음 문제 →')+'</button></div>';
}
document.querySelectorAll('.grades button').forEach(b=>b.addEventListener('click',()=>setGrade(b.id.slice(1))));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
app.addEventListener('click',e=>{
const a=e.target.closest('[data-answer]');if(a){answer(Number(a.dataset.answer));return}
const b=e.target.closest('[data-action]');if(!b)return;
switch(b.dataset.action){
case 'login-now':loginBtn.click();break;
case 'delete-rank':adminDeleteScore(b.dataset.entry);break;
case 'reset-review':resetReview();break;case 'show-rank':switchTab('rank');break;
case 'flip':flipped=!flipped;render();break;
case 'known':mark(true);break;case 'miss':mark(false);break;
case 'next':index++;flipped=false;render();break;
case 'prev':index=Math.max(0,index-1);flipped=false;render();break;
case 'restart':switchTab(mode==='quiz'?'quiz':'card');break;
case 'quiz-next':index++;choices=[];render();break;
case 'speak':if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(deck[index][0]);u.lang='en-US';u.rate=.83;speechSynthesis.cancel();speechSynthesis.speak(u)}break;
}
});
loginBtn.addEventListener('click',async()=>{
if(!auth||!fb){status('로그인 기능 로딩 중');return}
try{if(user)await fb.signOut(auth);else await fb.signInWithPopup(auth,new fb.GoogleAuthProvider())}
catch(e){status('로그인 오류: '+(e.code||e.message))}
});
window.startKidsFirebase=(config,api)=>{
try{
fb=api;const instance=api.initializeApp(config);auth=api.getAuth(instance);db=api.getFirestore(instance);
api.onAuthStateChanged(auth,async u=>{
++authVersion;user=u;cloudReady=!!u;activeProfile=null;profileSyncReady=false;
loginBtn.textContent=u?'로그아웃':'Google 로그인';
status(u?'Google 로그인 완료 · 자녀 프로필 불러오는 중…':'Google 로그인이 필요합니다');
if(u){await loadProfiles()}else{profiles=[];renderProfileBar();switchTab('card')}

});
}catch(e){status('Firebase 초기화 오류: '+e.message)}
};
setGrade('1-2');
</script><script type="module">
