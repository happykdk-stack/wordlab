<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordLab Kids | 그림 영어 놀이터</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#24324e;background:#f7f6ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:730px;margin:auto;padding:20px 14px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:29px;color:#5b49b8}h2{font-size:21px}.sub{color:#7b7b99;font-size:13px}.chip{background:#e9e3ff;color:#5545b0;border-radius:40px;padding:8px 12px;font-weight:700;font-size:12px}.grades,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.grades button,.tabs button{flex:1;min-width:95px}button{border:0;background:#7865dc;color:white;border-radius:14px;padding:12px 13px;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.4}.grades button,.tabs button{background:#eae6fc;color:#6051a4}.grades button.active,.tabs button.active{background:#7865dc;color:white}.panel{background:white;border:1px solid #eeeafa;border-radius:23px;padding:21px;box-shadow:0 10px 30px #4433980b}.meta{display:flex;justify-content:space-between;color:#777894;font-size:13px;margin-bottom:12px}.bar{height:9px;border-radius:30px;background:#eeeafb;overflow:hidden;margin-bottom:15px}.bar span{display:block;height:100%;background:#63c7ac}.flash{min-height:300px;background:linear-gradient(135deg,#f9f3ff,#eaf7ff);border:2px solid #e7e0fb;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;gap:11px}.emoji{font-size:92px;line-height:1.25}.word{font-size:36px;font-weight:850;color:#4c43a0}.meaning{font-size:26px;font-weight:750}.hint{font-size:13px;color:#8585a4}.sentence{font-size:16px}.actions button{flex:1}.secondary{background:#eae6fc;color:#5546a4}.success{background:#25a880}.danger{background:#e97989}.choice{display:block;width:100%;background:#f1effb;color:#342f62;text-align:left;margin:9px 0}.choice.right{background:#d6f5e8}.choice.wrong{background:#ffe1e5}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:#f2effe;border-radius:16px;padding:16px}.stat b{display:block;font-size:29px;margin-top:6px}.stat small{color:#777894}.notice{background:#f2effe;border-radius:14px;padding:13px;color:#5c5585;font-size:13px;line-height:1.6}.footer{text-align:center;color:#8b8ba4;font-size:12px;margin-top:18px}@media(max-width:480px){h1{font-size:25px}.panel{padding:14px}.flash{min-height:265px}.emoji{font-size:75px}.word{font-size:30px}}
</style></head><body><div class="wrap"><header><div><h1>🌈 WordLab Kids</h1><div class="sub">그림으로 배우는 신나는 영어!</div></div><div class="chip" id="count">60 WORDS</div></header><div class="grades"><button id="g1-2" onclick="grade('1-2')">🌱 1~2학년</button><button id="g3-4" onclick="grade('3-4')">🌼 3~4학년</button><button id="g5-6" onclick="grade('5-6')">🚀 5~6학년</button></div><div class="tabs"><button id="tcard" onclick="tab('card')">🃏 낱말카드</button><button id="tquiz" onclick="tab('quiz')">🎯 퀴즈</button><button id="treview" onclick="tab('review')">🔁 다시 복습</button><button id="tstats" onclick="tab('stats')">⭐ 내 통계</button></div><main id="app" class="panel"></main><div class="footer">학습 기록은 현재 기기의 브라우저에만 저장됩니다. 다른 기기와 자동 공유되지 않습니다.</div></div><script>
const DATA={"1-2":[["Apple","사과","🍎","I eat an apple."],["Banana","바나나","🍌","I like bananas."],["Cat","고양이","🐱","The cat is cute."],["Dog","강아지","🐶","The dog runs."],["Bird","새","🐦","A bird can fly."],["Fish","물고기","🐟","I see a fish."],["Sun","태양","☀️","The sun is bright."],["Moon","달","🌙","Look at the moon."],["Star","별","⭐","I see a star."],["Book","책","📚","This is my book."],["Pencil","연필","✏️","I have a pencil."],["School","학교","🏫","I go to school."],["House","집","🏠","This is my house."],["Car","자동차","🚗","The car is red."],["Bus","버스","🚌","I take the bus."],["Flower","꽃","🌸","The flower is pink."],["Tree","나무","🌳","The tree is tall."],["Milk","우유","🥛","I drink milk."],["Bread","빵","🍞","I eat bread."],["Ball","공","⚽","Kick the ball."]],"3-4":[["Weather","날씨","🌤️","The weather is nice."],["Rainbow","무지개","🌈","I see a rainbow."],["Mountain","산","⛰️","We climb the mountain."],["River","강","🏞️","The river is long."],["Library","도서관","📖","I read at the library."],["Hospital","병원","🏥","The hospital is near."],["Bicycle","자전거","🚲","I ride my bicycle."],["Breakfast","아침 식사","🥣","I eat breakfast early."],["Vegetable","채소","🥕","Vegetables are healthy."],["Adventure","모험","🧭","We go on an adventure."],["Friendship","우정","🤝","Friendship is important."],["Excited","신이 난","🎉","I am excited today."],["Careful","조심하는","⚠️","Be careful on the stairs."],["Quiet","조용한","🤫","Please be quiet."],["Different","다른","🧩","We have different ideas."],["Together","함께","👫","Let's work together."],["Practice","연습하다","🎯","I practice English."],["Explore","탐험하다","🔭","We explore the forest."],["Describe","묘사하다","🖼️","Describe your favorite animal."],["Compare","비교하다","⚖️","Compare the two pictures."]],"5-6":[["Environment","환경","🌍","We should protect the environment."],["Pollution","오염","🏭","Pollution harms animals."],["Recycle","재활용하다","♻️","We recycle paper."],["Energy","에너지","⚡","Solar panels produce energy."],["Discover","발견하다","🔎","Scientists discover new things."],["Experiment","실험","🧪","We did a science experiment."],["Evidence","증거","🕵️","Look for evidence."],["Solution","해결책","💡","We found a solution."],["Challenge","도전","🧗","This challenge is difficult."],["Opportunity","기회","🚪","This is a great opportunity."],["Responsibility","책임","🎒","Taking care of pets is a responsibility."],["Cooperate","협력하다","🤝","We cooperate on the project."],["Communicate","소통하다","💬","We communicate clearly."],["Creative","창의적인","🎨","She has a creative idea."],["Confident","자신감 있는","🦁","I feel confident today."],["Curious","호기심 많은","🔍","Curious students ask questions."],["Improve","향상시키다","📈","I want to improve my English."],["Organize","정리하다","🗂️","Let's organize our notes."],["Predict","예측하다","🔮","Can you predict the weather?"],["Achievement","성취","🏆","Finishing the book is an achievement."]]};
const PREFIX='wordlabkids_v1_';let level='1-2',mode='card',index=0,flipped=false,deck=[],answered=false,choices=[],score=0;
const app=document.getElementById('app');
function getState(){try{return JSON.parse(localStorage.getItem(PREFIX+level)||'{}')}catch(e){return {}}}
function getStats(){try{return JSON.parse(localStorage.getItem(PREFIX+'stats_'+level)||'{}')}catch(e){return {}}}
function saveState(s){try{localStorage.setItem(PREFIX+level,JSON.stringify(s))}catch(e){}}
function saveStats(s){try{localStorage.setItem(PREFIX+'stats_'+level,JSON.stringify(s))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function grade(g){level=g;document.querySelectorAll('.grades button').forEach(b=>b.classList.toggle('active',b.id==='g'+g));tab('card')}
function tab(m){mode=m;index=0;flipped=false;answered=false;score=0;choices=[];window.choiceIndex=-1;deck=m==='review'?DATA[level].filter(x=>getState()[x[0]]==='missed'):m==='quiz'?shuffle(DATA[level]):DATA[level];document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='t'+m));render()}
function top(){return '<div class="meta"><span>'+(level==='1-2'?'1~2학년':level==='3-4'?'3~4학년':'5~6학년')+'</span><span>'+(index+1)+' / '+deck.length+'</span></div><div class="bar"><span style="width:'+Math.round((index+1)/deck.length*100)+'%"></span></div>'}
function render(){if(mode==='stats')return renderStats();if(mode==='quiz')return renderQuiz();if(!deck.length){app.innerHTML='<h2>🎉 복습할 단어가 없어요!</h2><p>낱말카드나 퀴즈에서 다시 복습할 단어를 선택해 보세요.</p>';return}if(index>=deck.length){app.innerHTML='<h2>🏆 오늘의 학습 완료!</h2><p>정말 잘했어요! 내일도 만나요.</p><button onclick="tab(\'card\')">처음부터 다시</button>';return}const x=deck[index];app.innerHTML=top()+'<div class="flash" onclick="flipped=!flipped;render()">'+(flipped?'<div class="emoji">'+x[2]+'</div><div class="meaning">'+esc(x[1])+'</div><div class="sentence">'+esc(x[3])+'</div><div class="hint">카드를 누르면 영어 단어가 나와요</div>':'<div class="emoji">'+x[2]+'</div><div class="word">'+esc(x[0])+'</div><div class="hint">카드를 눌러 뜻을 확인해요</div>')+'</div><div class="actions"><button class="secondary" onclick="speak()">🔊 발음</button><button class="danger" onclick="mark(false)">다시 공부</button><button class="success" onclick="mark(true)">알아요 ✓</button></div><div class="actions"><button class="secondary" '+(index===0?'disabled':'')+' onclick="index--;flipped=false;render()">← 이전</button><button class="secondary" onclick="index++;flipped=false;render()">다음 →</button></div>'}
function speak(){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(deck[index][0]);u.lang='en-US';u.rate=.83;speechSynthesis.cancel();speechSynthesis.speak(u)}
function mark(ok){const s=getState();s[deck[index][0]]=ok?'known':'missed';saveState(s);const t=getStats();t.cardChecks=(t.cardChecks||0)+1;saveStats(t);index++;flipped=false;render()}
function renderQuiz(){if(index>=deck.length){app.innerHTML='<h2>🎉 퀴즈 완료!</h2><div class="notice">정답 '+score+' / '+deck.length+'개! 정말 잘했어요.</div><div class="actions"><button onclick="tab(\'quiz\')">다시 도전</button><button class="secondary" onclick="tab(\'review\')">틀린 단어 복습</button></div>';return}const x=deck[index];if(!choices.length||window.choiceIndex!==index){choices=shuffle([x,...shuffle(DATA[level].filter(y=>y[0]!==x[0])).slice(0,3)]);window.choiceIndex=index;answered=false}app.innerHTML=top()+'<div class="flash" style="min-height:205px;cursor:default"><div class="emoji">'+x[2]+'</div><div class="meaning">이 그림의 영어 단어는?</div></div><div id="choices">'+choices.map((c,i)=>'<button class="choice" id="ch'+i+'" onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(c[0])+'</button>').join('')+'</div><div id="feedback"></div>'}
function answer(i){if(answered)return;answered=true;const x=deck[index],ok=choices[i][0]===x[0];if(ok)score++;const s=getState();s[x[0]]=ok?'known':'missed';saveState(s);const t=getStats();t.attempts=(t.attempts||0)+1;t.correct=(t.correct||0)+(ok?1:0);saveStats(t);choices.forEach((c,j)=>{const b=document.getElementById('ch'+j);b.disabled=true;if(c[0]===x[0])b.classList.add('right');else if(j===i)b.classList.add('wrong')});document.getElementById('feedback').innerHTML='<div class="notice">'+(ok?'정답! ⭐':'다음엔 맞힐 수 있어요! 💛')+' <b>'+esc(x[0])+'</b> = '+esc(x[1])+'<p>'+esc(x[3])+'</p></div><div class="actions"><button onclick="index++;choices=[];renderQuiz()">다음 문제 →</button></div>'}
function renderStats(){const s=getState(),t=getStats(),known=Object.values(s).filter(v=>v==='known').length,missed=Object.values(s).filter(v=>v==='missed').length,pct=t.attempts?Math.round((t.correct||0)/t.attempts*100):0;app.innerHTML='<h2>⭐ 나의 영어 성장 기록</h2><div class="stats">'+[['학습 완료',known+'개'],['복습할 단어',missed+'개'],['퀴즈 정답률',pct+'%'],['푼 문제',t.attempts||0]].map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><div class="notice" style="margin-top:18px">🌟 '+(known>=18?'영어 탐험왕!':known>=10?'멋진 영어 탐험가!':known>=3?'반짝반짝 성장 중!':'오늘 첫 단어부터 시작해요!')+'<p>학년별로 기록이 따로 저장돼요.</p></div>'}
grade('1-2');
</script></body></html>
