<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordLab Kids | 그림 영어 놀이터</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#24324e;background:#f7f6ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:730px;margin:auto;padding:20px 14px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:29px;color:#5b49b8}h2{font-size:21px}.sub{color:#7b7b99;font-size:13px}.chip{background:#e9e3ff;color:#5545b0;border-radius:40px;padding:8px 12px;font-weight:700;font-size:12px}.grades,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.grades button,.tabs button{flex:1;min-width:95px}button{border:0;background:#7865dc;color:white;border-radius:14px;padding:12px 13px;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.4}.grades button,.tabs button{background:#eae6fc;color:#6051a4}.grades button.active,.tabs button.active{background:#7865dc;color:white}.panel{background:white;border:1px solid #eeeafa;border-radius:23px;padding:21px;box-shadow:0 10px 30px #4433980b}.meta{display:flex;justify-content:space-between;color:#777894;font-size:13px;margin-bottom:12px}.bar{height:9px;border-radius:30px;background:#eeeafb;overflow:hidden;margin-bottom:15px}.bar span{display:block;height:100%;background:#63c7ac}.flash{min-height:300px;background:linear-gradient(135deg,#f9f3ff,#eaf7ff);border:2px solid #e7e0fb;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;gap:11px}.emoji{font-size:92px;line-height:1.25}.word{font-size:36px;font-weight:850;color:#4c43a0}.meaning{font-size:26px;font-weight:750}.hint{font-size:13px;color:#8585a4}.sentence{font-size:16px}.actions button{flex:1}.secondary{background:#eae6fc;color:#5546a4}.success{background:#25a880}.danger{background:#e97989}.choice{display:block;width:100%;background:#f1effb;color:#342f62;text-align:left;margin:9px 0}.choice.right{background:#d6f5e8}.choice.wrong{background:#ffe1e5}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:#f2effe;border-radius:16px;padding:16px}.stat b{display:block;font-size:29px;margin-top:6px}.stat small{color:#777894}.notice{background:#f2effe;border-radius:14px;padding:13px;color:#5c5585;font-size:13px;line-height:1.6}.rankrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px solid #eeeafa}.rankrow:last-child{border-bottom:0}.rankrow strong{font-size:14px}.formrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.formrow input{min-width:120px;flex:1;border:1px solid #ded8f2;border-radius:12px;padding:12px;font:inherit}.formrow button{flex:0 0 auto}.footer{text-align:center;color:#8b8ba4;font-size:12px;margin-top:18px}@media(max-width:480px){h1{font-size:25px}.panel{padding:14px}.flash{min-height:265px}.emoji{font-size:75px}.word{font-size:30px}}
</style></head><body><div class="wrap"><header><div><h1>🌈 WordLab Kids</h1><div class="sub">그림으로 배우는 신나는 영어!</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:end"><div class="chip" id="count">60 WORDS</div><button id="loginBtn" class="secondary" type="button">Google 로그인</button><span id="cloudStatus" class="sub">이 기기에 저장 중</span></div></header><div class="grades"><button id="g1-2" onclick="setGrade('1-2')">🌱 1~2학년</button><button id="g3-4" onclick="grade('3-4')">🌼 3~4학년</button><button id="g5-6" onclick="grade('5-6')">🚀 5~6학년</button></div><div class="tabs"><button id="tcard" data-tab="card">🃏 낱말카드</button><button id="tquiz" data-tab="quiz">🎯 퀴즈</button><button id="treview" data-tab="review">🔁 다시 복습</button><button id="tstats" data-tab="stats">⭐ 내 통계</button><button id="trank" data-tab="rank">🏆 친구 순위</button></div><main id="app" class="panel"></main><div class="footer">로그인 시 학습 기록을 동기화할 수 있습니다. 친구 순위 참여는 선택 사항입니다.</div></div><script>
const DATA={"1-2":[["Apple","사과","🍎","I eat an apple."],["Banana","바나나","🍌","I like bananas."],["Cat","고양이","🐱","The cat is cute."],["Dog","강아지","🐶","The dog runs."],["Bird","새","🐦","A bird can fly."],["Fish","물고기","🐟","I see a fish."],["Sun","태양","☀️","The sun is bright."],["Moon","달","🌙","Look at the moon."],["Star","별","⭐","I see a star."],["Book","책","📚","This is my book."],["Pencil","연필","✏️","I have a pencil."],["School","학교","🏫","I go to school."],["House","집","🏠","This is my house."],["Car","자동차","🚗","The car is red."],["Bus","버스","🚌","I take the bus."],["Flower","꽃","🌸","The flower is pink."],["Tree","나무","🌳","The tree is tall."],["Milk","우유","🥛","I drink milk."],["Bread","빵","🍞","I eat bread."],["Ball","공","⚽","Kick the ball."]],"3-4":[["Weather","날씨","🌤️","The weather is nice."],["Rainbow","무지개","🌈","I see a rainbow."],["Mountain","산","⛰️","We climb the mountain."],["River","강","🏞️","The river is long."],["Library","도서관","📖","I read at the library."],["Hospital","병원","🏥","The hospital is near."],["Bicycle","자전거","🚲","I ride my bicycle."],["Breakfast","아침 식사","🥣","I eat breakfast early."],["Vegetable","채소","🥕","Vegetables are healthy."],["Adventure","모험","🧭","We go on an adventure."],["Friendship","우정","🤝","Friendship is important."],["Excited","신이 난","🎉","I am excited today."],["Careful","조심하는","⚠️","Be careful on the stairs."],["Quiet","조용한","🤫","Please be quiet."],["Different","다른","🧩","We have different ideas."],["Together","함께","👫","Let's work together."],["Practice","연습하다","🎯","I practice English."],["Explore","탐험하다","🔭","We explore the forest."],["Describe","묘사하다","🖼️","Describe your favorite animal."],["Compare","비교하다","⚖️","Compare the two pictures."]],"5-6":[["Environment","환경","🌍","We should protect the environment."],["Pollution","오염","🏭","Pollution harms animals."],["Recycle","재활용하다","♻️","We recycle paper."],["Energy","에너지","⚡","Solar panels produce energy."],["Discover","발견하다","🔎","Scientists discover new things."],["Experiment","실험","🧪","We did a science experiment."],["Evidence","증거","🕵️","Look for evidence."],["Solution","해결책","💡","We found a solution."],["Challenge","도전","🧗","This challenge is difficult."],["Opportunity","기회","🚪","This is a great opportunity."],["Responsibility","책임","🎒","Taking care of pets is a responsibility."],["Cooperate","협력하다","🤝","We cooperate on the project."],["Communicate","소통하다","💬","We communicate clearly."],["Creative","창의적인","🎨","She has a creative idea."],["Confident","자신감 있는","🦁","I feel confident today."],["Curious","호기심 많은","🔍","Curious students ask questions."],["Improve","향상시키다","📈","I want to improve my English."],["Organize","정리하다","🗂️","Let's organize our notes."],["Predict","예측하다","🔮","Can you predict the weather?"],["Achievement","성취","🏆","Finishing the book is an achievement."]]};
const PREFIX='wordlabkids_v1_';
let level='1-2',mode='card',index=0,flipped=false,deck=[],choices=[],answered=false,score=0;
let auth=null,db=null,fb=null,user=null,cloudReady=false,authVersion=0;
let rankJoined=false,rankAlias='',rankRows=[],rankError='',rankTimer=null;
const app=document.getElementById('app');
const loginBtn=document.getElementById('loginBtn');
const cloudStatus=document.getElementById('cloudStatus');
const localKey=g=>PREFIX+g;
const statsKey=g=>PREFIX+'stats_'+g;
function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function state(){return read(localKey(level))}
function stats(){return read(statsKey(level))}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function status(t){cloudStatus.textContent=t}
function maskMail(email){const p=String(email||'').split('@');if(p.length!==2)return '계정';const n=p[0];const d=p[1].split('.');return n.slice(0,Math.min(2,n.length))+'***@'+d[0].slice(0,1)+'***.'+(d.slice(1).join('.')||'com')}
function completed(){return Object.keys(DATA).reduce((n,g)=>n+Object.values(read(localKey(g))).filter(v=>v==='known').length,0)}
function safeAlias(s){return String(s||'').trim().slice(0,12)}
async function publishKidsRank(){if(!rankJoined||!user||!cloudReady)return;await fb.setDoc(fb.doc(db,'kidsLeaderboard',user.uid),{alias:rankAlias||'영어 탐험가',maskedEmail:maskMail(user.email),known:completed(),updatedAt:Date.now()})}
async function refreshKidsRank(){if(mode!=='rank')return;if(!user||!cloudReady){rankRows=[];rankError='Google 로그인 및 클라우드 연결 후 사용할 수 있어요.';render();return}try{const snap=await fb.getDocs(fb.collection(db,'kidsLeaderboard'));rankRows=snap.docs.map(d=>d.data()).sort((a,b)=>(b.known||0)-(a.known||0)).slice(0,30);rankError=''}catch(e){rankRows=[];rankError='순위표 권한 설정 필요: '+(e.code||'unknown')}render()}
async function joinKidsRank(){if(!user||!cloudReady){rankError='로그인과 동기화를 먼저 확인해 주세요.';render();return}const input=app.querySelector('#kidAlias');rankAlias=safeAlias(input?.value)||'영어 탐험가';rankJoined=true;try{await publishKidsRank();write('wordlabkids_rank_'+user.uid,{joined:true,alias:rankAlias});await refreshKidsRank()}catch(e){rankJoined=false;rankError='순위 등록 실패: '+(e.code||'unknown');render()}}
async function leaveKidsRank(){if(!user)return;try{await fb.deleteDoc(fb.doc(db,'kidsLeaderboard',user.uid));rankJoined=false;localStorage.removeItem('wordlabkids_rank_'+user.uid);await refreshKidsRank()}catch(e){rankError='참여 취소 실패: '+(e.code||'unknown');render()}}
function sync(){
if(!cloudReady||!user||!fb)return;
const doc=fb.doc(db,'users',user.uid,'wordlab','kids');
status('☁ 저장 중…');
fb.setDoc(doc,{grades:{[level]:state()},statistics:{[level]:stats()}},{merge:true}).then(async()=>{status('☁ 동기화 완료');if(rankJoined)await publishKidsRank()}).catch(e=>status('저장 오류: '+e.code));
}
function setGrade(g){
if(!DATA[g])return;
level=g;document.querySelectorAll('.grades button').forEach(b=>b.classList.toggle('active',b.id==='g'+g));switchTab('card');
}
function switchTab(m){
mode=m;index=0;flipped=false;choices=[];answered=false;score=0;
deck=m==='review'?DATA[level].filter(x=>state()[x[0]]==='missed'):m==='quiz'?shuffle(DATA[level]):DATA[level];
document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===m));
render();
if(rankTimer){clearInterval(rankTimer);rankTimer=null}if(m==='rank'){refreshKidsRank();rankTimer=setInterval(()=>{if(mode==='rank')refreshKidsRank()},30000)}
}
function progressHeader(){return '<div class="meta"><span>'+esc(level)+'학년</span><span>'+(index+1)+' / '+deck.length+'</span></div><div class="bar"><span style="width:'+Math.round((index+1)/deck.length*100)+'%"></span></div>'}
function render(){
if(mode==='rank'){
app.innerHTML='<h2>🏆 친구 순위</h2><p class="sub">보호자가 정한 별명과 일부 가린 Google 이메일을 함께 표시합니다. 학습 완료 단어가 많은 순서예요.</p><div class="notice">내 학습 완료: <b>'+completed()+' / 60개</b> · 계정: '+esc(user?maskMail(user.email):'로그인 필요')+'</div>'+
(rankJoined?'<p>표시 이름: <b>'+esc(rankAlias||'영어 탐험가')+'</b></p><div class="formrow"><input id="kidAlias" maxlength="12" placeholder="새 별명 (선택)"><button data-action="join-rank">이름 변경</button><button class="secondary" data-action="leave-rank">참여 취소</button></div>':'<p class="sub">친구에게 순위를 공개하려면 보호자 동의 후 참여해 주세요.</p><div class="formrow"><input id="kidAlias" maxlength="12" placeholder="별명 (예: 영어탐험가)"><button data-action="join-rank">순위 참여</button></div>')+
'<p class="sub">'+esc(rankError)+'</p>'+(rankRows.length?rankRows.map((r,i)=>'<div class="rankrow"><span><strong>'+(i+1)+'위 · '+esc(r.alias||'영어 탐험가')+'</strong><div class="sub">'+esc(r.maskedEmail||'비공개')+'</div></span><strong>'+Number(r.known||0)+'개 완료</strong></div>').join(''):'<p class="sub">아직 표시할 순위가 없어요.</p>');return}
if(mode==='stats'){const s=state(),t=stats(),known=Object.values(s).filter(v=>v==='known').length,missed=Object.values(s).filter(v=>v==='missed').length,pct=t.attempts?Math.round((t.correct||0)/t.attempts*100):0;
app.innerHTML='<h2>⭐ 나의 영어 성장 기록</h2><div class="stats">'+[['학습 완료',known+'개'],['복습할 단어',missed+'개'],['퀴즈 정답률',pct+'%'],['푼 문제',t.attempts||0]].map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><div class="notice" style="margin-top:18px">🌟 '+(known>=18?'영어 탐험왕!':known>=10?'멋진 영어 탐험가!':known>=3?'반짝반짝 성장 중!':'오늘 첫 단어부터 시작해요!')+'</div>';return}
if(!deck.length){app.innerHTML='<h2>🎉 복습할 단어가 없어요!</h2><p>다시 공부할 단어를 선택해 보세요.</p>';return}
if(index>=deck.length){app.innerHTML='<h2>🏆 학습 완료!</h2><p>정말 잘했어요!</p><button data-action="restart">처음부터 다시</button>';return}
const x=deck[index];
if(mode==='quiz'){
if(!choices.length){choices=shuffle([x,...shuffle(DATA[level].filter(y=>y[0]!==x[0])).slice(0,3)]);answered=false}
app.innerHTML=progressHeader()+'<div class="flash" style="min-height:190px"><div class="emoji">'+x[2]+'</div><div class="meaning">이 그림의 영어 단어는?</div></div><div id="choices">'+choices.map((c,i)=>'<button class="choice" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(c[0])+'</button>').join('')+'</div><div id="feedback"></div>';return
}
app.innerHTML=progressHeader()+'<div class="flash" data-action="flip">'+(flipped?'<div class="emoji">'+x[2]+'</div><div class="meaning">'+esc(x[1])+'</div><div class="sentence">'+esc(x[3])+'</div><div class="hint">다시 누르면 영어가 나와요</div>':'<div class="emoji">'+x[2]+'</div><div class="word">'+esc(x[0])+'</div><div class="hint">카드를 눌러 뜻을 확인해요</div>')+'</div><div class="actions"><button class="secondary" data-action="speak">🔊 발음</button><button class="danger" data-action="miss">다시 공부</button><button class="success" data-action="known">알아요 ✓</button></div><div class="actions"><button class="secondary" data-action="prev" '+(index===0?'disabled':'')+'>← 이전</button><button class="secondary" data-action="next">다음 →</button></div>';
}
function mark(ok){
const x=deck[index],s=state();s[x[0]]=ok?'known':'missed';write(localKey(level),s);
const t=stats();t.cardChecks=(t.cardChecks||0)+1;write(statsKey(level),t);sync();index++;flipped=false;render();
}
function answer(i){
if(answered)return;answered=true;const x=deck[index],ok=choices[i][0]===x[0];if(ok)score++;
const s=state();s[x[0]]=ok?'known':'missed';write(localKey(level),s);
const t=stats();t.attempts=(t.attempts||0)+1;t.correct=(t.correct||0)+(ok?1:0);write(statsKey(level),t);sync();
choices.forEach((c,j)=>{const b=app.querySelector('[data-answer="'+j+'"]');b.disabled=true;if(c[0]===x[0])b.classList.add('right');else if(j===i)b.classList.add('wrong')});
app.querySelector('#feedback').innerHTML='<div class="notice">'+(ok?'정답! ⭐':'다음엔 맞힐 수 있어요! 💛')+' <b>'+esc(x[0])+'</b> = '+esc(x[1])+'<p>'+esc(x[3])+'</p></div><div class="actions"><button data-action="quiz-next">다음 문제 →</button></div>';
}
document.querySelectorAll('.grades button').forEach(b=>b.addEventListener('click',()=>setGrade(b.id.slice(1))));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
app.addEventListener('click',e=>{
const a=e.target.closest('[data-answer]');if(a){answer(Number(a.dataset.answer));return}
const b=e.target.closest('[data-action]');if(!b)return;
switch(b.dataset.action){
case 'join-rank':joinKidsRank();break;case 'leave-rank':leaveKidsRank();break;
case 'flip':flipped=!flipped;render();break;
case 'known':mark(true);break;case 'miss':mark(false);break;
case 'next':index++;flipped=false;render();break;
case 'prev':index=Math.max(0,index-1);flipped=false;render();break;
case 'restart':switchTab(mode==='quiz'?'quiz':'card');break;
case 'quiz-next':index++;choices=[];render();break;
case 'speak':if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(deck[index][0]);u.lang='en-US';u.rate=.83;speechSynthesis.cancel();speechSynthesis.speak(u)}break;
}
});
loginBtn.addEventListener('click',async()=>{
if(!auth||!fb){status('로그인 기능 로딩 중');return}
try{if(user)await fb.signOut(auth);else await fb.signInWithPopup(auth,new fb.GoogleAuthProvider())}
catch(e){status('로그인 오류: '+(e.code||e.message))}
});
window.startKidsFirebase=(config,api)=>{
try{
fb=api;const instance=api.initializeApp(config);auth=api.getAuth(instance);db=api.getFirestore(instance);
api.onAuthStateChanged(auth,async u=>{
const version=++authVersion;user=u;cloudReady=false;loginBtn.textContent=u?'로그아웃':'Google 로그인';
if(!u){rankJoined=false;rankRows=[];rankAlias='';status('이 기기에 저장 중');if(mode==='rank')render();return}
const rankPref=read('wordlabkids_rank_'+u.uid);rankJoined=!!rankPref.joined;rankAlias=safeAlias(rankPref.alias);
status('☁ 연결 중…');
try{
const ref=api.doc(db,'users',u.uid,'wordlab','kids');
const snap=await api.getDoc(ref);if(version!==authVersion)return;
const remote=snap.exists()?snap.data():{};
for(const g of Object.keys(DATA)){
const merged={...read(localKey(g)),...(remote.grades?.[g]||{})};
write(localKey(g),merged);
const localStats=read(statsKey(g)),rs=remote.statistics?.[g]||{};
write(statsKey(g),{attempts:Math.max(localStats.attempts||0,rs.attempts||0),correct:Math.max(localStats.correct||0,rs.correct||0),cardChecks:Math.max(localStats.cardChecks||0,rs.cardChecks||0)});
}
cloudReady=true;status('☁ 동기화 완료');
try{const entry=await api.getDoc(api.doc(db,'kidsLeaderboard',u.uid));if(version!==authVersion)return;if(entry.exists()){rankJoined=true;rankAlias=safeAlias(entry.data().alias);write('wordlabkids_rank_'+u.uid,{joined:true,alias:rankAlias});await publishKidsRank()}}catch(e){console.warn('Kids rank status',e)}
render();if(mode==='rank')refreshKidsRank();
await api.setDoc(ref,{grades:Object.fromEntries(Object.keys(DATA).map(g=>[g,read(localKey(g))])),statistics:Object.fromEntries(Object.keys(DATA).map(g=>[g,read(statsKey(g))]))},{merge:true});
}catch(e){status('클라우드 오류: '+(e.code||e.message))}
});
}catch(e){status('Firebase 초기화 오류: '+e.message)}
};
setGrade('1-2');
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,getDocs,collection,deleteDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-lite.js';
window.startKidsFirebase({apiKey:"AIzaSyAASI3Hbju_-h6Y2eOoCSLzY_FlmFsQ-rY",authDomain:"wordla-a0099.firebaseapp.com",projectId:"wordla-a0099",appId:"1:141561526977:web:d4d52fc4f92c21a1233240"},{initializeApp,getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,getFirestore,doc,getDoc,setDoc,getDocs,collection,deleteDoc});
</script></body></html>
