name: Generate WordLab Stories every two days
on:
  schedule:
    - cron: "30 0 * * *" # 09:30 KST; generator skips alternate dates
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-stories.yml'
      - 'scripts/generate-daily-stories.cjs'
permissions:
  contents: write
concurrency:
  group: wordlab-daily-stories
  cancel-in-progress: false
jobs:
  generate-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check story generator syntax
        run: node --check scripts/generate-daily-stories.cjs
      - name: Generate missing WordLab stories
        id: generate
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORDLAB_STORY_MODEL: gpt-4.1-mini
        run: node scripts/generate-daily-stories.cjs
      - name: Verify generated JavaScript
        run: node --check assets/wordlab-stories.js
      - name: Commit generated stories including successful partial batches
        run: |
          git config user.name "wordlab-stories-bot"
          git config user.email "wordlab-stories-bot@users.noreply.github.com"
          git add assets/wordlab-stories.js
          if ! git diff --cached --quiet; then
            git commit -m "stories: publish one lesson every two days"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new stories."
          fi
      - name: Fail visibly if content generation failed
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::Some WordLab Stories did not generate. Rerun to catch up."
          exit 1
